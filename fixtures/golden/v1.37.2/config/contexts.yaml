      error: open /home/student/.kube/config.lock: file exists
      error: open /home/student/.kube/config.lock: file exists
  - run: KUBECONFIG=a.yaml:b.yaml kubectl config get-contexts
    exit: 0
    stdout: |
      CURRENT   NAME    CLUSTER   AUTHINFO   NAMESPACE
                ctx-a   ca        ua         
      *         ctx-b   cb        ub         
