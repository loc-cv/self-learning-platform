# Captured from fixtures/golden/cases/client/yaml-input.yaml by npm run golden:capture. Do not edit.
# Format and normalization tokens: docs/FIDELITY.md §6.
case: client/yaml-input
description: How kubectl reads manifests (YAMLOrJSONDecoder, sigs.k8s.io/yaml over yaml.v2 with YAML 1.1 resolution) and the errors it prints for broken ones. `kubectl label --local -f` decodes the file into an unstructured object without a server and prints it again, so what yaml.v2 made of every value shows in the output.
kubernetes: v1.37.2
oracle:
  mode: client
steps:
  - run: kubectl label --local -f styles.yaml l=v -o yaml
    exit: 0
    stdout: |
      apiVersion: v1
      data:
        complex key: value
        double: "tab\there\nnewline A é \U0001F600 \\ \" end"
        empty: ""
        empty literal: ""
        flow map:
          a: 1
          b:
          - x
          - true
          c:
            d: e
        flow seq:
        - a
        - b
        - c
        - 1
        - true
        folded: |
          folded lines
          paragraph
            more indented
          last
        folded double: |-
          one two
          three
        folded strip: a b
        indicator: |2
            two extra spaces
        keep: |+
          keeps both

        literal: |
          line 1
            indented
          line 3
        multiline plain: first continued and more
        nested:
        - a
        - - b
          - c
        - k: v
          k2: v2
        nothing: null
        plain: some text
        quoted key: 1
        single: it's 'quoted'
        strip: no newline at the end
        tilde: null
      kind: ConfigMap
      metadata:
        labels:
          l: v
        name: styles
    stderr: ""
  - run: kubectl label --local -f styles.yaml l=v -o json
    exit: 0
    stdout: |
