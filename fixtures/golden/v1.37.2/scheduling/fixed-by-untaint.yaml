case: scheduling/fixed-by-untaint
description: A Pod that only the control plane matches waits on its taint; removing the taint schedules it there; the taint is put back.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
