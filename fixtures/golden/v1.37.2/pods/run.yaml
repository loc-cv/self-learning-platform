    stderr: ""
  - run: kubectl get pods --show-labels
    exit: 0
    stdout: |
      NAME    READY   STATUS    RESTARTS   AGE       LABELS
      nginx   1/1     Running   0          <<age>>   app=web
    stderr: ""
