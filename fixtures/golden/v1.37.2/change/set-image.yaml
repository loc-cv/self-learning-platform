  - objects:
      - ref: deployment/web
        object:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            annotations:
              deployment.kubernetes.io/revision: "6"
            creationTimestamp: <<time>>
            generation: 6
            labels:
              app: web
            name: web
            namespace: default
            resourceVersion: <<rv>>
            uid: <<uid:1>>
          spec:
            progressDeadlineSeconds: 600
            replicas: 1
            revisionHistoryLimit: 10
            selector:
              matchLabels:
                app: web
            strategy:
              rollingUpdate:
                maxSurge: 25%
                maxUnavailable: 25%
              type: RollingUpdate
            template:
              metadata:
                labels:
                  app: web
              spec:
                containers:
                  - image: nginx:1.28
                    imagePullPolicy: IfNotPresent
                    name: nginx
