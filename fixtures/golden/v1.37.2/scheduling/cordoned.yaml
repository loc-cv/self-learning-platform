case: scheduling/cordoned
description: Both workers cordoned, so only the tainted control plane is left; uncordoning node01 schedules the Pod there, after one more failure while the node lifecycle controller has not yet removed node01's unschedulable taint.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
