description: >-
  describe deployment after scaling up and down (the ScalingReplicaSet events), after a rollout
  (old and new ReplicaSets), with the Recreate strategy, and with a Pod template that has
  annotations, a service account, command, environment, resources and volumes.
files:
  worker.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: worker
      labels:
        app: worker
      annotations:
        example.com/team: batch
    spec:
      replicas: 0
      minReadySeconds: 5
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: worker
      template:
        metadata:
          labels:
            app: worker
          annotations:
            example.com/scrape: "true"
        spec:
          serviceAccountName: default
          nodeSelector:
            kubernetes.io/os: linux
          tolerations:
          - key: dedicated
            operator: Equal
            value: batch
            effect: NoSchedule
          containers:
          - name: worker
            image: busybox:1.36
            command: ["sh", "-c"]
            args: ["while true; do sleep 3600; done"]
            env:
            - name: QUEUE
              value: jobs
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            resources:
              requests:
                cpu: 50m
                memory: 32Mi
              limits:
                memory: 64Mi
            volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: config
              mountPath: /etc/worker
              readOnly: true
          volumes:
          - name: scratch
            emptyDir: {}
          - name: config
            configMap:
              name: worker-config
setup:
  - do: kubectl create deployment web --image=nginx:1.27 --replicas=2
  - do: kubectl rollout status deployment/web --timeout=60s
steps:
  - run: kubectl scale deployment web --replicas=4
  - do: kubectl rollout status deployment/web --timeout=60s
  - sleep: 1
  - run: kubectl scale deployment web --replicas=1
  - do: kubectl rollout status deployment/web --timeout=60s
  - run: kubectl describe deployment web
  - run: kubectl set image deployment/web nginx=nginx:1.28
  - do: kubectl rollout status deployment/web --timeout=60s
  - run: kubectl describe deployments
  - run: kubectl describe deploy -l app=web
  - run: kubectl create -f worker.yaml
  - do: kubectl rollout status deployment/worker --timeout=60s
  # an env value from a fieldRef prints as an empty cell and " (v1:metadata.name)", which the
  # describe-table split cannot recover: compared as plain text
  - run: kubectl describe deployment worker
    table: none
  - run: kubectl describe deployments --show-events=false
    table: none
