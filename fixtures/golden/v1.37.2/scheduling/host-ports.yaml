case: scheduling/host-ports
description: Two Pods pinned to node01 with the same hostPort; the second waits for a free port and is scheduled once the first is deleted.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
