description: >-
  kubectl __complete for the first argument of every command: subcommands with their
  descriptions, the completion function each command registers (resource types, allowed types,
  names, pods, nodes, contexts) or none, and the directive.
setup:
  - do: kubectl run web --image=nginx:1.27
  - do: kubectl create deployment frontend --image=nginx:1.27 --replicas=0
