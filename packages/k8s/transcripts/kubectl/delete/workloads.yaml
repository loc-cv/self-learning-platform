# web, keep: nginx stops at once on SIGTERM. slow: sleep runs as PID 1 and ignores SIGTERM,
# so the kubelet kills it when the grace period ends (30 s by default).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.31.8
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow
  labels:
    app: slow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slow
  template:
    metadata:
      labels:
        app: slow
    spec:
      containers:
      - name: sleep
        image: busybox:1.37
        command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keep
  labels:
    app: keep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keep
  template:
    metadata:
      labels:
        app: keep
    spec:
      containers:
      - name: nginx
        image: nginx:1.31.8
