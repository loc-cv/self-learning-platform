case: controllers/paused
description: "kubectl rollout pause and resume: the Progressing condition while paused (DeploymentPaused), a template change that starts no rollout while paused, rollout status without watching, pausing twice and resuming twice; then resume and the finished rollout."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
steps:
  - run: kubectl rollout pause deployment/web
    exit: 0
    stdout: |
      deployment.apps/web paused
    stderr: ""
  - objects:
      - ref: deployment/web
        object:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            annotations:
              deployment.kubernetes.io/revision: "1"
            creationTimestamp: <<time>>
            generation: 2
            labels:
              app: web
            name: web
            namespace: default
            resourceVersion: <<rv>>
            uid: <<uid:1>>
          spec:
            paused: true
            progressDeadlineSeconds: 600
            replicas: 2
            revisionHistoryLimit: 10
            selector:
              matchLabels:
                app: web
            strategy:
              rollingUpdate:
                maxSurge: 25%
                maxUnavailable: 25%
              type: RollingUpdate
            template:
              metadata:
                labels:
                  app: web
              spec:
                containers:
                  - image: nginx:1.27
                    imagePullPolicy: IfNotPresent
                    name: nginx
                    resources: {}
                    terminationMessagePath: /dev/termination-log
                    terminationMessagePolicy: File
                dnsPolicy: ClusterFirst
                restartPolicy: Always
                schedulerName: default-scheduler
                securityContext: {}
                terminationGracePeriodSeconds: 30
          status:
            availableReplicas: 2
            conditions:
              - lastTransitionTime: <<time>>
                lastUpdateTime: <<time>>
                message: Deployment has minimum availability.
                reason: MinimumReplicasAvailable
                status: "True"
                type: Available
              - lastTransitionTime: <<time>>
                lastUpdateTime: <<time>>
                message: Deployment is paused
                reason: DeploymentPaused
                status: Unknown
                type: Progressing
            observedGeneration: 2
            readyReplicas: 2
            replicas: 2
            terminatingReplicas: 0
            updatedReplicas: 2
  - run: kubectl rollout pause deployment/web
    exit: 1
    stdout: ""
    stderr: |
      error: deployments.apps "web" is already paused
  - run: kubectl set image deployment/web nginx=nginx:1.28
    exit: 0
    stdout: |
      deployment.apps/web image updated
    stderr: ""
  - run: kubectl get rs
    exit: 0
    stdout: |
      NAME             DESIRED   CURRENT   READY   AGE
      web-<<hash:1>>   2         2         2       <<age>>
    stderr: ""
  - run: kubectl rollout status deployment/web --watch=false
    exit: 0
    stdout: |
      Waiting for deployment "web" rollout to finish: 0 out of 2 new replicas have been updated...
    stderr: ""
  - run: kubectl get deployment web -o jsonpath='{.status.conditions[?(@.type=="Progressing")]}'
    exit: 0
    stdout: '{"lastTransitionTime":"<<time>>","lastUpdateTime":"<<time>>","message":"Deployment is paused","reason":"DeploymentPaused","status":"Unknown","type":"Progressing"}'
    stderr: ""
  - run: kubectl rollout resume deployment/web
    exit: 0
    stdout: |
      deployment.apps/web resumed
    stderr: ""
  - run: kubectl rollout resume deployment/web
    exit: 1
    stdout: ""
    stderr: |
