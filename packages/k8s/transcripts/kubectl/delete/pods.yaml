# Pods whose container ignores SIGTERM (`sleep` as PID 1): the kubelet kills it when the grace
# period ends.
apiVersion: v1
kind: Pod
metadata:
  name: a
spec:
  containers:
  - name: sleep
    image: busybox:1.37
    command: ["sleep", "3600"]
