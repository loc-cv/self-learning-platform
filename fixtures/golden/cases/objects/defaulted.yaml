description: Minimal manifests and the objects the API server stores for them, with every default filled in.
files:
  minimal.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: minimal
    spec:
      selector:
        matchLabels:
          app: minimal
      template:
        metadata:
          labels:
            app: minimal
        spec:
          containers:
          - name: app
            image: nginx:1.27
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: minimal
    spec:
      selector:
        app: minimal
      ports:
      - port: 80
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: minimal
    data:
      key: value
    ---
    apiVersion: v1
    kind: Namespace
    metadata:
      name: minimal
    ---
    apiVersion: v1
    kind: Pod
    metadata:
      name: minimal
    spec:
      nodeName: node02
      containers:
      - name: app
        image: busybox:1.37
        command: ["sleep", "3600"]
setup:
  - do: kubectl create -f minimal.yaml
  - do: kubectl rollout status deployment/minimal --timeout=60s
steps:
  - run: kubectl create -f minimal.yaml
  - objects: [deployment/minimal, service/minimal, configmap/minimal, namespace/minimal, pod/minimal]
  - objects: [replicaset]
