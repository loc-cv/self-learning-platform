    stdout: |
      NAME              READY   STATUS    RESTARTS   AGE       IP       NODE           NOMINATED NODE   READINESS GATES
      on-controlplane   0/1     Pending   0          <<age>>   <none>   <none>         <none>           <none>
      tolerates         1/1     Running   0          <<age>>   <<ip>>   controlplane   <none>           <none>
      too-much-both     0/1     Pending   0          <<age>>   <none>   <none>         <none>           <none>
      too-much-cpu      0/1     Pending   0          <<age>>   <none>   <none>         <none>           <none>
      too-much-memory   0/1     Pending   0          <<age>>   <none>   <none>         <none>           <none>
      wants-ssd         0/1     Pending   0          <<age>>   <none>   <none>         <none>           <none>
    stderr: ""
    kwok: true
  - run: kubectl describe pod on-controlplane
