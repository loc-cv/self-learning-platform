  - run: kubectl config get-contexts new
    exit: 0
    stdout: |
      CURRENT   NAME   CLUSTER   AUTHINFO   NAMESPACE
                new    staging   dev        
    stderr: ""
  - run: kubectl config set-context
    exit: 1
    stdout: ""
    stderr: |
      error: you must specify a non-empty context name or --current
  - run: kubectl config set-context x --current
    exit: 1
