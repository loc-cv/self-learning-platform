case: info/no-server
description: "kubectl version, api-resources, api-versions and cluster-info with no server: what each prints before and after the request that cannot connect."
kubernetes: v1.37.2
oracle:
  mode: client
steps:
  - run: kubectl version -o json
    exit: 1
    stdout: |
      {
        "clientVersion": {
          "major": "1",
          "minor": "37",
          "gitVersion": "v1.37.2",
          "gitCommit": "c50e5395f1ae2d4a2c05f28fdcc38c0916cc1a32",
          "gitTreeState": "clean",
          "buildDate": "<<time>>",
          "goVersion": "go1.26.10",
          "compiler": "gc",
          "platform": "linux/amd64"
        },
        "kustomizeVersion": "v5.8.1"
      }
    stderr: |
      The connection to the server localhost:8080 was refused - did you specify the right host or port?
  - run: kubectl version -o yaml --client
    exit: 0
    stdout: |+
      clientVersion:
        buildDate: "<<time>>"
        compiler: gc
