    stderr: ""
  - run: kubectl set image --local -f local.yaml init=busybox:1.37 -o yaml
    exit: 0
    stdout: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          app: loc
        name: loc
      spec:
        selector:
          matchLabels:
            app: loc
        strategy: {}
        template:
          metadata:
