        data:
          x: "1"
        kind: ConfigMap
        metadata:
          creationTimestamp: "<<time>>"
          labels:
            app: list
          name: a
          namespace: default
          resourceVersion: "<<rv>>"
          uid: <<uid:1>>
      - apiVersion: v1
        data:
          "y": "2"
        kind: ConfigMap
        metadata:
          creationTimestamp: "<<time>>"
          labels:
            app: list
