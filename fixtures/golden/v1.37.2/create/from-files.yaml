    stdout: |
      configmap/dir-a created (dry run)
      configmap/dir-b created (dry run)
      configmap/dir-c created (dry run)
    stderr: ""
  - run: kubectl create -R -f dir
    exit: 1
    stdout: |
      configmap/dir-c created
