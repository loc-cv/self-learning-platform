# Captured from fixtures/golden/cases/explain/recursive.yaml by npm run golden:capture. Do not edit.
# Format and normalization tokens: docs/FIDELITY.md §6.
case: explain/recursive
description: kubectl explain --recursive and --max-depth - nested field lists, enums in the short form, and where a recursive type stops.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
steps:
  - run: kubectl explain deployment.spec.strategy --recursive
    exit: 0
    stdout: |+
      GROUP:      apps
      KIND:       Deployment
      VERSION:    v1

      FIELD: strategy <DeploymentStrategy>


      DESCRIPTION:
          The deployment strategy to use to replace existing pods with new ones.
          DeploymentStrategy describes how to replace existing pods with new ones.
          
      FIELDS:
        rollingUpdate	<RollingUpdateDeployment>
          maxSurge	<IntOrString>
          maxUnavailable	<IntOrString>
        type	<string>
        enum: Recreate, RollingUpdate

    stderr: ""
  - run: kubectl explain service.spec --recursive
    exit: 0
    stdout: |+
      KIND:       Service
      VERSION:    v1

      FIELD: spec <ServiceSpec>


      DESCRIPTION:
          Spec defines the behavior of a service.
          https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
          ServiceSpec describes the attributes that a user creates on a service.
          
      FIELDS:
        allocateLoadBalancerNodePorts	<boolean>
        clusterIP	<string>
        clusterIPs	<[]string>
        externalIPs	<[]string>
        externalName	<string>
        externalTrafficPolicy	<string>
        enum: Cluster, Local
        healthCheckNodePort	<integer>
        internalTrafficPolicy	<string>
        enum: Cluster, Local
        ipFamilies	<[]string>
        ipFamilyPolicy	<string>
        enum: PreferDualStack, RequireDualStack, SingleStack
        loadBalancerClass	<string>
        loadBalancerIP	<string>
        loadBalancerSourceRanges	<[]string>
        ports	<[]ServicePort>
          appProtocol	<string>
          name	<string>
          nodePort	<integer>
          port	<integer> -required-
          protocol	<string>
          enum: SCTP, TCP, UDP
          targetPort	<IntOrString>
        publishNotReadyAddresses	<boolean>
        selector	<map[string]string>
        sessionAffinity	<string>
        enum: ClientIP, None
        sessionAffinityConfig	<SessionAffinityConfig>
          clientIP	<ClientIPConfig>
            timeoutSeconds	<integer>
        trafficDistribution	<string>
        type	<string>
        enum: ClusterIP, ExternalName, LoadBalancer, NodePort

    stderr: ""
  - run: kubectl explain pod.spec.containers.ports -R
    exit: 0
    stdout: |+
      KIND:       Pod
      VERSION:    v1

      FIELD: ports <[]ContainerPort>


      DESCRIPTION:
          List of ports to expose from the container. Not specifying a port here DOES
          NOT prevent that port from being exposed. Any port which is listening on the
          default "0.0.0.0" address inside a container will be accessible from the
          network. Modifying this array with strategic merge patch may corrupt the
          data. For more information See
          https://github.com/kubernetes/kubernetes/issues/108255. Cannot be updated.
          ContainerPort represents a network port in a single container.
          
      FIELDS:
        containerPort	<integer> -required-
        hostIP	<string>
        hostPort	<integer>
        name	<string>
        protocol	<string>
        enum: SCTP, TCP, UDP

    stderr: ""
  - run: kubectl explain deployment --recursive --max-depth=2
    exit: 0
    stdout: |+
      GROUP:      apps
      KIND:       Deployment
      VERSION:    v1

      DESCRIPTION:
          Deployment enables declarative updates for Pods and ReplicaSets.
          
      FIELDS:
        apiVersion	<string>
        kind	<string>
        metadata	<ObjectMeta>
          annotations	<map[string]string>
          creationTimestamp	<string>
          deletionGracePeriodSeconds	<integer>
          deletionTimestamp	<string>
          finalizers	<[]string>
          generateName	<string>
          generation	<integer>
          labels	<map[string]string>
          managedFields	<[]ManagedFieldsEntry>
          name	<string>
          namespace	<string>
          ownerReferences	<[]OwnerReference>
          resourceVersion	<string>
          selfLink	<string>
          uid	<string>
        spec	<DeploymentSpec> -required-
          minReadySeconds	<integer>
          paused	<boolean>
          progressDeadlineSeconds	<integer>
          replicas	<integer>
          revisionHistoryLimit	<integer>
          selector	<LabelSelector> -required-
          strategy	<DeploymentStrategy>
          template	<PodTemplateSpec> -required-
        status	<DeploymentStatus>
          availableReplicas	<integer>
          collisionCount	<integer>
          conditions	<[]DeploymentCondition>
          observedGeneration	<integer>
          readyReplicas	<integer>
          replicas	<integer>
          terminatingReplicas	<integer>
          unavailableReplicas	<integer>
          updatedReplicas	<integer>

    stderr: ""
  - run: kubectl explain configmaps -R
    exit: 0
    stdout: |+
      KIND:       ConfigMap
      VERSION:    v1

      DESCRIPTION:
          ConfigMap holds configuration data for pods to consume.
          
      FIELDS:
        apiVersion	<string>
        binaryData	<map[string]string>
        data	<map[string]string>
        immutable	<boolean>
        kind	<string>
        metadata	<ObjectMeta>
          annotations	<map[string]string>
          creationTimestamp	<string>
          deletionGracePeriodSeconds	<integer>
          deletionTimestamp	<string>
          finalizers	<[]string>
          generateName	<string>
          generation	<integer>
          labels	<map[string]string>
          managedFields	<[]ManagedFieldsEntry>
            apiVersion	<string>
            fieldsType	<string>
            fieldsV1	<FieldsV1>
            manager	<string>
            operation	<string>
            subresource	<string>
            time	<string>
          name	<string>
          namespace	<string>
          ownerReferences	<[]OwnerReference>
            apiVersion	<string> -required-
            blockOwnerDeletion	<boolean>
            controller	<boolean>
            kind	<string> -required-
            name	<string> -required-
            uid	<string> -required-
          resourceVersion	<string>
          selfLink	<string>
          uid	<string>

    stderr: ""
  - run: kubectl explain job.spec -R --max-depth 1
    exit: 0
    stdout: |+
      GROUP:      batch
      KIND:       Job
      VERSION:    v1

      FIELD: spec <JobSpec>


      DESCRIPTION:
          Specification of the desired behavior of a job. More info:
          https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
          JobSpec describes how the job execution will look like.
          
      FIELDS:
        activeDeadlineSeconds	<integer>
        backoffLimit	<integer>
        backoffLimitPerIndex	<integer>
        completionMode	<string>
        enum: Indexed, NonIndexed
        completions	<integer>
        managedBy	<string>
        manualSelector	<boolean>
        maxFailedIndexes	<integer>
        parallelism	<integer>
        podFailurePolicy	<PodFailurePolicy>
        podReplacementPolicy	<string>
        enum: Failed, TerminatingOrFailed
        scheduling	<JobSchedulingConfiguration>
        selector	<LabelSelector>
        successPolicy	<SuccessPolicy>
        suspend	<boolean>
        template	<PodTemplateSpec> -required-
        ttlSecondsAfterFinished	<integer>

    stderr: ""
  - run: kubectl explain crd.spec.versions.schema -R
    exit: 0
    stdout: |+
      GROUP:      apiextensions.k8s.io
      KIND:       CustomResourceDefinition
      VERSION:    v1

      FIELD: schema <CustomResourceValidation>


      DESCRIPTION:
          schema describes the schema used for validation, pruning, and defaulting of
          this version of the custom resource.
          CustomResourceValidation is a list of validation methods for
          CustomResources.
          
      FIELDS:
        openAPIV3Schema	<JSONSchemaProps>
          $ref	<string>
          $schema	<string>
          additionalItems	<JSONSchemaPropsOrBool>
          additionalProperties	<JSONSchemaPropsOrBool>
          allOf	<[]JSONSchemaProps>
          anyOf	<[]JSONSchemaProps>
          default	<JSON>
          definitions	<map[string]JSONSchemaProps>
          dependencies	<map[string]JSONSchemaPropsOrStringArray>
          description	<string>
          enum	<[]JSON>
          example	<JSON>
          exclusiveMaximum	<boolean>
          exclusiveMinimum	<boolean>
          externalDocs	<ExternalDocumentation>
            description	<string>
            url	<string>
          format	<string>
          id	<string>
          items	<JSONSchemaPropsOrArray>
          maxItems	<integer>
          maxLength	<integer>
          maxProperties	<integer>
          maximum	<number>
          minItems	<integer>
          minLength	<integer>
          minProperties	<integer>
          minimum	<number>
          multipleOf	<number>
          not	<JSONSchemaProps>
          nullable	<boolean>
          oneOf	<[]JSONSchemaProps>
          pattern	<string>
          patternProperties	<map[string]JSONSchemaProps>
          properties	<map[string]JSONSchemaProps>
          required	<[]string>
          title	<string>
          type	<string>
          uniqueItems	<boolean>
          x-kubernetes-embedded-resource	<boolean>
          x-kubernetes-int-or-string	<boolean>
          x-kubernetes-list-map-keys	<[]string>
          x-kubernetes-list-type	<string>
          x-kubernetes-map-type	<string>
          x-kubernetes-preserve-unknown-fields	<boolean>
          x-kubernetes-validations	<[]ValidationRule>
            fieldPath	<string>
            message	<string>
            messageExpression	<string>
            optionalOldSelf	<boolean>
            reason	<string>
            enum: FieldValueDuplicate, FieldValueForbidden, FieldValueInvalid, FieldValueRequired
            rule	<string> -required-

    stderr: ""
