                    uid: <<uid:2>>
              kind: EndpointSlice
              metadata:
                creationTimestamp: <<time>>
                generateName: front-
                generation: 2
                labels:
                  endpointslice.kubernetes.io/managed-by: endpointslice-controller.k8s.io
                  kubernetes.io/service-name: front
                name: front-<<suffix>>
                namespace: default
                ownerReferences:
                  - apiVersion: v1
                    blockOwnerDeletion: true
                    controller: true
                    kind: Service
                    name: front
                    uid: <<uid:4>>
                resourceVersion: <<rv>>
                uid: <<uid:5>>
              ports:
                - name: metrics
                  port: 9100
                  protocol: TCP
                - name: web
                  port: 8080
                  protocol: TCP
          kind: List
          metadata:
            resourceVersion: ""
      - ref: endpoints/front
        object:
          apiVersion: v1
          kind: Endpoints
          metadata:
            creationTimestamp: <<time>>
            labels:
              endpoints.kubernetes.io/managed-by: endpoint-controller
            name: front
            namespace: default
            resourceVersion: <<rv>>
            uid: <<uid:6>>
          subsets:
            - addresses:
                - ip: <<ip>>
                  nodeName: node01
                  targetRef:
                    kind: Pod
                    name: web-<<hash:1>>-<<suffix>>
                    namespace: default
                    uid: <<uid:1>>
                - ip: <<ip>>
                  nodeName: node01
                  targetRef:
                    kind: Pod
                    name: web-<<hash:1>>-<<suffix>>
                    namespace: default
                    uid: <<uid:2>>
              ports:
