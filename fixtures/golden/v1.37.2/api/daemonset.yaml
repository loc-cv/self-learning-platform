case: api/daemonset
description: DaemonSets through the raw API. Defaulting (minimal, kube-proxy as kubeadm writes it, OnDelete, percentages), the template generation annotation, validation of the selector, the update strategy and the pod template, generation on spec, template and metadata changes, the immutable selector, and the status subresource. The real DaemonSet controller writes status in the background, so the case waits for it to observe each generation (its writes show in managedFields, which the differential test ignores, DIV-015), the responses of later steps keep only metadata and spec, and status is only written with PUT, whose response is the status just written. kube-proxy gets no Pods (its ServiceAccount does not exist); the others' Pods never become ready, so their status settles once a generation is observed.
