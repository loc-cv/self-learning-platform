case: info/version
description: kubectl version against the server, in every output format.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
steps:
  - run: kubectl version
    exit: 0
    stdout: |
      Client Version: v1.37.2
      Kustomize Version: v5.8.1
      Server Version: v1.37.2
    stderr: ""
