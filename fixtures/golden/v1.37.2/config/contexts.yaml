# Captured from fixtures/golden/cases/config/contexts.yaml by npm run golden:capture. Do not edit.
# Format and normalization tokens: docs/FIDELITY.md §6.
case: config/contexts
description: "kubectl config get-contexts, current-context, use-context, set-context, get-clusters, get-users and delete-context with no server, and the kubeconfig files as clientcmd rewrites them: the file ModifyConfig chooses (~/.kube/config, the KUBECONFIG list, --kubeconfig), its serialization, mode and messages."
kubernetes: v1.37.2
oracle:
  mode: client
steps:
  - run: kubectl config get-contexts
    exit: 0
    stdout: |
      CURRENT   NAME                          CLUSTER      AUTHINFO           NAMESPACE
                dev@staging                   staging      dev                team-a
      *         kubernetes-admin@kubernetes   kubernetes   kubernetes-admin   
    stderr: ""
  - run: kubectl config get-contexts -o name
    exit: 0
    stdout: |
      dev@staging
      kubernetes-admin@kubernetes
    stderr: ""
  - run: kubectl config get-contexts --no-headers
    exit: 0
    stdout: |2
            dev@staging                   staging      dev                team-a
      *     kubernetes-admin@kubernetes   kubernetes   kubernetes-admin   
    stderr: ""
  - run: kubectl config get-contexts dev@staging nope other
    exit: 1
    stdout: |
      CURRENT   NAME          CLUSTER   AUTHINFO   NAMESPACE
                dev@staging   staging   dev        team-a
    stderr: |
      context nope not found
      context other not found
  - run: kubectl config get-contexts -o wide
    exit: 1
    stdout: ""
    stderr: |
      error: --output wide is not available in kubectl config get-contexts; resetting to default output format
  - run: kubectl config get-clusters
    exit: 0
    stdout: |
      NAME
      kubernetes
      staging
    stderr: ""
    unorderedLines: true
  - run: kubectl config get-users
    exit: 0
    stdout: |
      NAME
      dev
      kubernetes-admin
    stderr: ""
  - run: kubectl config current-context
    exit: 0
    stdout: |
      kubernetes-admin@kubernetes
    stderr: ""
  - run: kubectl config use-context dev@staging
    exit: 0
    stdout: |
      Switched to context "dev@staging".
    stderr: ""
  - run: cat .kube/config
    exit: 0
    stdout: |
      apiVersion: v1
      clusters:
      - cluster:
          certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg==
          server: https://172.16.0.10:6443
        name: kubernetes
      - cluster:
          server: https://10.0.0.5:6443
        name: staging
      contexts:
      - context:
          cluster: staging
          namespace: team-a
          user: dev
        name: dev@staging
      - context:
          cluster: kubernetes
          user: kubernetes-admin
        name: kubernetes-admin@kubernetes
      current-context: dev@staging
      kind: Config
      users:
      - name: dev
        user:
          token: abc123
      - name: kubernetes-admin
        user:
          client-certificate-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg==
          client-key-data: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCg==
    stderr: ""
  - run: kubectl config use dev@staging
    exit: 0
    stdout: |
      Switched to context "dev@staging".
    stderr: ""
  - run: kubectl config use-context nope
    exit: 1
    stdout: ""
    stderr: |
      error: no context exists with the name: "nope"
  - run: kubectl config use-context ''
    exit: 1
    stdout: ""
    stderr: |
      error: empty context names are not allowed
  - run: kubectl config use-context a b
    exit: 1
    stdout: |
      Set the current-context in a kubeconfig file.

      Aliases:
      use-context, use

      Examples:
        # Use the context for the minikube cluster
        kubectl config use-context minikube

      Usage:
        kubectl config use-context CONTEXT_NAME [options]

      Use "kubectl options" for a list of global command-line options (applies to all commands).
    stderr: |
      error: Unexpected args: [a b]
  - run: kubectl config set-context --current --namespace=team-b
    exit: 0
    stdout: |
      Context "dev@staging" modified.
    stderr: ""
  - run: cat .kube/config
    exit: 0
