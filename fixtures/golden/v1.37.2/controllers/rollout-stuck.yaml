  - run: kubectl patch deployment web -p '{"spec":{"progressDeadlineSeconds":10,"template":{"metadata":{"annotations":{"simlab.dev/kwok-not-ready":"true"}}}}}'
    exit: 0
    stdout: |
      deployment.apps/web patched
    stderr: ""
  - run: kubectl get rs
    exit: 0
    stdout: |
