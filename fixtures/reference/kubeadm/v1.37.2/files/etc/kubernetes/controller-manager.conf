apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: <<cert:ca>>
    server: https://172.16.0.10:6443
  name: kubernetes
contexts:
- context:
    cluster: kubernetes
    user: system:kube-controller-manager
  name: system:kube-controller-manager@kubernetes
current-context: system:kube-controller-manager@kubernetes
kind: Config
users:
- name: system:kube-controller-manager
  user:
    client-certificate-data: <<cert:controller-manager>>
    client-key-data: <<key:controller-manager>>
