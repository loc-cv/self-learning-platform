  - run: kubectl set image --local -f local.yaml nginx=nginx:2
    exit: 0
    stdout: |
      deployment.apps/loc image updated
    stderr: ""
  - run: kubectl set image --local -f local.yaml nginx=nginx:2 --dry-run=client
    exit: 0
