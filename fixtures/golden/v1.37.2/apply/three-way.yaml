    stdout: |
      deployment.apps/app created
    stderr: ""
  - run: kubectl apply -f app-v2.yaml
    exit: 0
    stdout: |
      deployment.apps/app configured
    stderr: ""
  - objects:
      - ref: deployment/app
        object:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            annotations:
              deployment.kubernetes.io/revision: "2"
              kubectl.kubernetes.io/last-applied-configuration: |
                {"apiVersion":"apps/v1","kind":"Deployment","metadata":{"annotations":{},"labels":{"app":"app"},"name":"app","namespace":"default"},"spec":{"replicas":0,"selector":{"matchLabels":{"app":"app"}},"template":{"metadata":{"labels":{"app":"app"}},"spec":{"containers":[{"env":[{"name":"MODE","value":"staging"}],"image":"nginx:1.27","name":"web","ports":[{"containerPort":80,"name":"http"}]}]}}}}
            creationTimestamp: <<time>>
            generation: 2
            labels:
              app: app
            name: app
            namespace: default
            resourceVersion: <<rv>>
            uid: <<uid:1>>
          spec:
            progressDeadlineSeconds: 600
            replicas: 0
            revisionHistoryLimit: 10
            selector:
              matchLabels:
                app: app
            strategy:
              rollingUpdate:
                maxSurge: 25%
                maxUnavailable: 25%
              type: RollingUpdate
            template:
              metadata:
                labels:
                  app: app
              spec:
                containers:
                  - env:
                      - name: MODE
                        value: staging
                    image: nginx:1.27
                    imagePullPolicy: IfNotPresent
                    name: web
                    ports:
                      - containerPort: 80
                        name: http
                        protocol: TCP
                    resources: {}
                    terminationMessagePath: /dev/termination-log
                    terminationMessagePolicy: File
                dnsPolicy: ClusterFirst
                restartPolicy: Always
                schedulerName: default-scheduler
                securityContext: {}
                terminationGracePeriodSeconds: 30
          status:
            conditions:
              - lastTransitionTime: <<time>>
                lastUpdateTime: <<time>>
                message: Deployment has minimum availability.
                reason: MinimumReplicasAvailable
                status: "True"
                type: Available
              - lastTransitionTime: <<time>>
