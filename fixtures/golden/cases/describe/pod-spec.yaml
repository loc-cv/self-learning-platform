description: >-
  describe pod for a Pod that cannot be scheduled, with most of what its spec can hold: init
  containers, command and arguments over several lines, ports, probes of each kind, environment
  from values, fields, resources, Secrets and ConfigMaps, envFrom with a prefix, mounts with a
  subPath, each common volume source, security profiles, tolerations, topology spread
  constraints, readiness gates, long and multi-line annotations.
files:
  pod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: full
      labels:
        app: full
        tier: back
      annotations:
        example.com/short: value
        example.com/long: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        example.com/multi: |
          first line
          second line
    spec:
      # the simulator has no ServiceAccount admission yet (D-046), which would set it
      serviceAccountName: default
      nodeSelector:
        disktype: nvme
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      readinessGates:
      - conditionType: example.com/ready
      tolerations:
      - key: dedicated
        operator: Equal
        value: gpu
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      - key: zone
        operator: Exists
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: full
      - maxSkew: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      initContainers:
      - name: init
        image: busybox:1.36
        command: ["sh", "-c", "echo one\necho two"]
      containers:
      - name: app
        image: nginx:1.27
        args: ["--port", "8080"]
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
          hostPort: 9090
        - containerPort: 5353
          protocol: UDP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 5
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 3
        startupProbe:
          exec:
            command: ["cat", "/run/ready"]
          failureThreshold: 30
        securityContext:
          seccompProfile:
            type: Localhost
            localhostProfile: profiles/app.json
        env:
        - name: PLAIN
          value: hello
        - name: MULTI
          value: |-
            line one
            line two
        - name: MY_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CPU_LIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: 1m
        - name: MEM_REQUEST
          valueFrom:
            resourceFieldRef:
              resource: requests.memory
        - name: NO_MEM_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: app
              resource: limits.ephemeral-storage
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: creds
              key: password
              optional: true
        - name: MODE
          valueFrom:
            configMapKeyRef:
              name: settings
              key: mode
        envFrom:
        - configMapRef:
            name: settings
          prefix: CFG_
        - secretRef:
            name: creds
            optional: false
        resources:
          requests:
            cpu: 250m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/app
          readOnly: true
        - name: config
          mountPath: /etc/app.conf
          subPath: app.conf
      - name: sidecar
        image: busybox:1.36
        command: ["sleep", "infinity"]
        ports:
        - containerPort: 8443
          name: https
      volumes:
      - name: data
        emptyDir:
          sizeLimit: "0"
      - name: config
        configMap:
          name: settings
          optional: true
      - name: secret
        secret:
          secretName: creds
      - name: cache
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: scratch
        emptyDir: {}
      - name: host
        hostPath:
          path: /var/log
          type: Directory
      - name: plain-host
        hostPath:
          path: /srv
      - name: podinfo
        downwardAPI:
          items:
          - path: labels
            fieldRef:
              fieldPath: metadata.labels
          - path: cpu
            resourceFieldRef:
              containerName: app
              resource: limits.cpu
      - name: bundle
        projected:
          sources:
          - configMap:
              name: settings
          - secret:
              name: creds
              optional: true
          - downwardAPI:
              items:
              - path: name
                fieldRef:
                  fieldPath: metadata.name
          - serviceAccountToken:
              path: token
              expirationSeconds: 7200
      - name: share
        nfs:
          server: nfs.example.com
          path: /exports
          readOnly: true
setup:
  - do: kubectl create -f pod.yaml
  - until: kubectl get events --field-selector involvedObject.name=full,reason=FailedScheduling -o name
    match: event
steps:
  - run: kubectl describe pod full
