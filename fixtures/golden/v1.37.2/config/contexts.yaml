  - run: cat a.yaml; echo ---; cat b.yaml
    exit: 0
    stdout: |
      apiVersion: v1
      clusters:
      - cluster:
          server: https://a.example:6443
        name: ca
      contexts:
      - context:
          cluster: ca
          user: ua
        name: ctx-a
      current-context: ctx-a
      kind: Config
      users:
      - name: ua
        user:
          token: from-a
      ---
      apiVersion: v1
      kind: Config
      current-context: ctx-b
      clusters:
      - name: cb
        cluster:
          server: https://b.example:6443
      contexts:
