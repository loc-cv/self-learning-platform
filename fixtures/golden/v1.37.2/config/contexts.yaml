    exit: 0
    stdout: |
      Context "new" created.
    stderr: ""
  - run: cat .kube/config
    exit: 0
    stdout: |
      apiVersion: v1
      clusters:
      - cluster:
          certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg==
          server: https://172.16.0.10:6443
        name: kubernetes
      - cluster:
          server: https://10.0.0.5:6443
        name: staging
      contexts:
      - context:
          cluster: staging
          namespace: team-b
          user: dev
        name: dev@staging
      - context:
          cluster: kubernetes
          user: kubernetes-admin
        name: kubernetes-admin@kubernetes
      - context:
