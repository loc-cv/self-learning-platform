  - run: kubectl config set-context a b
    exit: 1
    stdout: |
      Set a context entry in kubeconfig.

       Specifying a name that already exists will merge new fields on top of existing values for those fields.

      Examples:
        # Set the user field on the gce context entry without touching other values
        kubectl config set-context gce --user=cluster-admin

      Options:
          --cluster='':
      	cluster for the context entry in kubeconfig

          --current=false:
      	Modify the current context

          -n, --namespace='':
      	namespace for the context entry in kubeconfig

          --user='':
      	user for the context entry in kubeconfig

      Usage:
        kubectl config set-context [NAME | --current] [--cluster=cluster_nickname] [--user=user_nickname] [--namespace=namespace] [options]

      Use "kubectl options" for a list of global command-line options (applies to all commands).
    stderr: |
      error: Unexpected args: [a b]
  - run: kubectl config delete-context nope
    exit: 1
    stdout: ""
    stderr: |
      error: cannot delete context nope, not in /home/student/.kube/config
