case: controllers/rollout-stuck
description: "A rolling update that cannot finish: the new template's Pods run but never become ready (KWOK's not-ready annotation), and with progressDeadlineSeconds 10 the deployment controller sets Progressing False, ProgressDeadlineExceeded. Records the ReplicaSets (maxSurge and maxUnavailable of 25% of 4), the Deployment's conditions and status, rollout status's error and the events."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
