# Captured from fixtures/golden/cases/generate/expose.yaml by npm run golden:capture. Do not edit.
# Format and normalization tokens: docs/FIDELITY.md §6.
case: generate/expose
description: kubectl expose for each kind it takes, read from the server (or from -f), with the selector, ports and protocols it infers and the flags that replace them; client and server dry runs; the created Services read back; and its errors (no ports, no selector, a Pod without labels, a kind it cannot expose, a missing object, an existing Service).
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
steps:
  - run: kubectl expose deployment web --dry-run=client -o yaml
    exit: 0
    stdout: |
      apiVersion: v1
      kind: Service
      metadata:
        labels:
          app: web
        name: web
      spec:
        ports:
        - port: 80
          protocol: TCP
          targetPort: 80
        selector:
          app: web
      status:
        loadBalancer: {}
    stderr: ""
  - run: kubectl expose deployment web --port=8080 --target-port=80 --name=web-alt --type=NodePort --dry-run=client -o json
    exit: 0
    stdout: |
      {
          "kind": "Service",
          "apiVersion": "v1",
          "metadata": {
              "name": "web-alt",
              "labels": {
                  "app": "web"
              }
          },
          "spec": {
              "ports": [
                  {
                      "protocol": "TCP",
                      "port": 8080,
                      "targetPort": 80
                  }
              ],
              "selector": {
                  "app": "web"
              },
              "type": "NodePort"
          },
          "status": {
              "loadBalancer": {}
          }
      }
    stderr: ""
  - run: kubectl expose deploy/web --port=80,81 --protocol=UDP --labels=a=b,c=d --selector=x=y --external-ip=1.2.3.4 --session-affinity=ClientIP --cluster-ip=None --dry-run=client -o yaml
    exit: 0
    stdout: |
