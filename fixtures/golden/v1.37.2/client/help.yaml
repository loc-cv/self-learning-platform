# Captured from fixtures/golden/cases/client/help.yaml by npm run golden:capture. Do not edit.
# Format and normalization tokens: docs/FIDELITY.md §6.
case: client/help
description: kubectl help and usage text as an 80-column terminal shows it.
kubernetes: v1.37.2
oracle:
  mode: client
steps:
  - run: kubectl --help
    tty: true
    cols: 80
    exit: 0
    output: |
      kubectl controls the Kubernetes cluster manager.

       Find more information at: https://kubernetes.io/docs/reference/kubectl/

      Basic Commands (Beginner):
        create          Create a resource from a file or from stdin
        expose          Take a replication controller, service, deployment or pod and
      expose it as a new Kubernetes service
        run             Run a particular image on the cluster
        set             Set specific features on objects

      Basic Commands (Intermediate):
        explain         Get documentation for a resource
        get             Display one or many resources
        edit            Edit a resource on the server
        delete          Delete resources by file names, stdin, resources and names, or
      by resources and label selector

      Deploy Commands:
        rollout         Manage the rollout of a resource
        scale           Set a new size for a deployment, replica set, or replication
      controller
        autoscale       Auto-scale a deployment, replica set, stateful set, or
      replication controller

      Cluster Management Commands:
        certificate     Modify certificate resources
        cluster-info    Display cluster information
        top             Display resource (CPU/memory) usage
        cordon          Mark node as unschedulable
        uncordon        Mark node as schedulable
        drain           Drain node in preparation for maintenance
        taint           Update the taints on one or more nodes

      Troubleshooting and Debugging Commands:
        describe        Show details of a specific resource or group of resources
        logs            Print the logs for a container in a pod
        attach          Attach to a running container
        exec            Execute a command in a container
        port-forward    Forward one or more local ports to a pod
        proxy           Run a proxy to the Kubernetes API server
        cp              Copy files and directories to and from containers
        auth            Inspect authorization
        debug           Create debugging sessions for troubleshooting workloads and
      nodes
        events          List events

      Advanced Commands:
        diff            Diff the live version against a would-be applied version
        apply           Apply a configuration to a resource by file name or stdin
        patch           Update fields of a resource
        replace         Replace a resource by file name or stdin
        wait            Wait for a specific condition on one or many resources
        kustomize       Build a kustomization target from a directory or URL

      Settings Commands:
        label           Update the labels on a resource
        annotate        Update the annotations on a resource
        completion      Output shell completion code for the specified shell (bash,
      zsh, fish, or powershell)

      Subcommands provided by plugins:

      Other Commands:
        api-resources   Print the supported API resources on the server
        api-versions    Print the supported API versions on the server, in the form of
      "group/version"
        config          Modify kubeconfig files
        kuberc          Manage kuberc configuration files
        plugin          Provides utilities for interacting with plugins
        version         Print the client and server version information

      Usage:
        kubectl [flags] [options]

      Use "kubectl <command> --help" for more information about a given command.
      Use "kubectl options" for a list of global command-line options (applies to all
      commands).
  - run: kubectl get --help
    tty: true
    cols: 80
    exit: 0
    output: |
      Display one or many resources.

       Prints a table of the most important information about the specified resources.
      You can filter the list using a label selector and the --selector flag. If the
      desired resource type is namespaced you will only see results in the current
      namespace if you don't specify any namespace.

       By specifying the output as 'template' and providing a Go template as the value
      of the --template flag, you can filter the attributes of the fetched resources.

      Use "kubectl api-resources" for a complete list of supported resources.

      Examples:
        # List all pods in ps output format
        kubectl get pods
        
        # List all pods in ps output format with more information (such as node name)
        kubectl get pods -o wide
        
        # List a single replication controller with specified NAME in ps output format
        kubectl get replicationcontroller web
        
        # List deployments in JSON output format, in the "v1" version of the "apps"
      API group
        kubectl get deployments.v1.apps -o json
        
        # List a single pod in JSON output format
        kubectl get -o json pod web-pod-13je7
        
        # List a pod identified by type and name specified in "pod.yaml" in JSON
      output format
        kubectl get -f pod.yaml -o json
        
        # List resources from a directory with kustomization.yaml - e.g.
      dir/kustomization.yaml
        kubectl get -k dir/
        
        # Return only the phase value of the specified pod
        kubectl get -o template pod/web-pod-13je7 --template={{.status.phase}}
        
        # List resource information in custom columns
        kubectl get pod test-pod -o
      custom-columns=CONTAINER:.spec.containers[0].name,IMAGE:.spec.containers[0].image
        
        # List all replication controllers and services together in ps output format
        kubectl get rc,services
        
        # List one or more resources by their type and names
        kubectl get rc/web service/frontend pods/web-pod-13je7
        
        # List the 'status' subresource for a single pod
        kubectl get pod web-pod-13je7 --subresource status
        
        # List all deployments in namespace 'backend'
        kubectl get deployments.apps --namespace backend
        
        # List all pods existing in all namespaces
        kubectl get pods --all-namespaces

      Options:
          -A, --all-namespaces=false:
      	If present, list the requested object(s) across all namespaces.
      	Namespace in current context is ignored even if specified with
      	--namespace.

          --allow-missing-template-keys=true:
      	If true, ignore any errors in templates when a field or map key is
      	missing in the template. Only applies to golang and jsonpath output
      	formats.

          --chunk-size=500:
      	Return large lists in chunks rather than all at once. Pass 0 to
      	disable.

          --field-selector='':
      	Selector (field query) to filter on, supports '=', '==', and
      	'!='.(e.g. --field-selector key1=value1,key2=value2). The server only
      	supports a limited number of field queries per type.

          -f, --filename=[]:
      	Filename, directory, or URL to files identifying the resource to get
      	from a server.

          --ignore-not-found=false:
      	If set to true, suppresses NotFound error for specific objects that do
      	not exist. Using this flag with commands that query for collections of
      	resources has no effect when no resources are found.

          -k, --kustomize='':
      	Process the kustomization directory. This flag can't be used together
      	with -f or -R.

          -L, --label-columns=[]:
      	Accepts a comma separated list of labels that are going to be
      	presented as columns. Names are case-sensitive. You can also use
      	multiple flag options like -L label1 -L label2...

          --no-headers=false:
      	When using the default or custom-column output format, don't print
      	headers (default print headers).

          -o, --output='':
      	Output format. One of: (json, yaml, kyaml, name, go-template,
      	go-template-file, template, templatefile, jsonpath, jsonpath-as-json,
      	jsonpath-file, custom-columns, custom-columns-file, wide). See custom
      	columns
      	[https://kubernetes.io/docs/reference/kubectl/#custom-columns], golang
      	template [http://golang.org/pkg/text/template/#pkg-overview] and
      	jsonpath template
      	[https://kubernetes.io/docs/reference/kubectl/jsonpath/].

          --output-watch-events=false:
      	Output watch event objects when --watch or --watch-only is used.
      	Existing objects are output as initial ADDED events.

          --raw='':
      	Raw URI to request from the server.  Uses the transport specified by
      	the kubeconfig file.

          -R, --recursive=false:
      	Process the directory used in -f, --filename recursively. Useful when
      	you want to manage related manifests organized within the same
      	directory.

          -l, --selector='':
      	Selector (label query) to filter on, supports '=', '==', '!=', 'in',
      	'notin'.(e.g. -l key1=value1,key2=value2,key3 in (value3)). Matching
      	objects must satisfy all of the specified label constraints.

          --server-print=true:
      	If true, have the server return the appropriate table output. Supports
      	extension APIs and CRDs.

          --show-kind=false:
      	If present, list the resource type for the requested object(s).

          --show-labels=false:
      	When printing, show all labels as the last column (default hide labels
      	column)

          --show-managed-fields=false:
      	If true, keep the managedFields when printing objects in JSON or YAML
      	format.

          --sort-by='':
      	If non-empty, sort list types using this field specification.  The
      	field specification is expressed as a JSONPath expression (e.g.
      	'{.metadata.name}'). The field in the API resource specified by this
      	JSONPath expression must be an integer or a string.

          --subresource='':
      	If specified, gets the subresource of the requested object.

          --template='':
      	Template string or path to template file to use when -o=go-template,
      	-o=go-template-file. The template format is golang templates
      	[http://golang.org/pkg/text/template/#pkg-overview].

          -w, --watch=false:
      	After listing/getting the requested object, watch for changes.

          --watch-only=false:
      	Watch for changes to the requested object(s), without listing/getting
      	first.

      Usage:
        kubectl get
      [(-o|--output=)json|yaml|kyaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-as-json|jsonpath-file|custom-columns|custom-columns-file|wide]
      (TYPE[.VERSION][.GROUP] [NAME | -l label] | TYPE[.VERSION][.GROUP]/NAME ...)
      [flags] [options]

      Use "kubectl options" for a list of global command-line options (applies to all
      commands).
  - run: kubectl run --help
    tty: true
    cols: 80
    exit: 0
    output: |
      Create and run a particular image in a pod.

      Examples:
        # Start a nginx pod
        kubectl run nginx --image=nginx
        
        # Start a hazelcast pod and let the container expose port 5701
        kubectl run hazelcast --image=hazelcast/hazelcast --port=5701
        
        # Start a hazelcast pod and set environment variables "DNS_DOMAIN=cluster" and
      "POD_NAMESPACE=default" in the container
        kubectl run hazelcast --image=hazelcast/hazelcast --env="DNS_DOMAIN=cluster"
      --env="POD_NAMESPACE=default"
        
        # Start a hazelcast pod and set labels "app=hazelcast" and "env=prod" in the
      container
        kubectl run hazelcast --image=hazelcast/hazelcast
      --labels="app=hazelcast,env=prod"
        
        # Dry run; print the corresponding API objects without creating them
        kubectl run nginx --image=nginx --dry-run=client
        
        # Start a nginx pod, but overload the spec with a partial set of values parsed
      from JSON
        kubectl run nginx --image=nginx --overrides='{ "apiVersion": "v1", "spec": {
      ... } }'
        
        # Start a busybox pod and keep it in the foreground, don't restart it if it
      exits
        kubectl run -i -t busybox --image=busybox --restart=Never
        
        # Start the nginx pod using the default command, but use custom arguments
      (arg1 .. argN) for that command
        kubectl run nginx --image=nginx -- <arg1> <arg2> ... <argN>
        
        # Start the nginx pod using a different command and custom arguments
        kubectl run nginx --image=nginx --command -- <cmd> <arg1> ... <argN>

      Options:
          --allow-missing-template-keys=true:
      	If true, ignore any errors in templates when a field or map key is
      	missing in the template. Only applies to golang and jsonpath output
      	formats.

          --annotations=[]:
      	Annotations to apply to the pod.

          --attach=false:
      	If true, wait for the Pod to start running, and then attach to the Pod
      	as if 'kubectl attach ...' were called.  Default false, unless
      	'-i/--stdin' is set, in which case the default is true. With
      	'--restart=Never' the exit code of the container process is returned.

          --cascade='background':
      	Must be "background", "orphan", or "foreground". Selects the deletion
      	cascading strategy for the dependents (e.g. Pods created by a
      	ReplicationController). Defaults to background.

          --command=false:
      	If true and extra arguments are present, use them as the 'command'
      	field in the container, rather than the 'args' field which is the
      	default.

          --detach-keys='ctrl-p,ctrl-q':
      	Override the key sequence for detaching a container.

          --dry-run='none':
      	Must be "none", "server", or "client". If client strategy, only print
      	the object that would be sent, without sending it. If server strategy,
      	submit server-side request without persisting the resource.

          --env=[]:
      	Environment variables to set in the container.

          --expose=false:
      	If true, create a ClusterIP service associated with the pod.  Requires
      	`--port`.

          --field-manager='kubectl-run':
      	Name of the manager used to track field ownership.

          --force=false:
      	If true, immediately remove resources from API and bypass graceful
      	deletion. Note that immediate deletion of some resources may result in
      	inconsistency or data loss and requires confirmation.

          --grace-period=-1:
      	Period of time in seconds given to the resource to terminate
      	gracefully. Ignored if negative. Set to 1 for immediate shutdown. Can
      	only be set to 0 when --force is true (force deletion).

          --image='':
      	The image for the container to run.

          --image-pull-policy='':
      	The image pull policy for the container.  If left empty, this value
      	will not be specified by the client and defaulted by the server.

          -k, --kustomize='':
      	Process a kustomization directory. This flag can't be used together
      	with -f or -R.

          -l, --labels='':
      	Comma separated labels to apply to the pod. Will override previous
      	values.

          --leave-stdin-open=false:
      	If the pod is started in interactive mode or with stdin, leave stdin
      	open after the first attach completes. By default, stdin will be
      	closed after the first attach completes.

          -o, --output='':
      	Output format. One of: (json, yaml, kyaml, name, go-template,
      	go-template-file, template, templatefile, jsonpath, jsonpath-as-json,
      	jsonpath-file).

          --override-type='merge':
      	The method used to override the generated object: json, merge, or
      	strategic.

          --overrides='':
      	An inline JSON override for the generated object. If this is
      	non-empty, it is used to override the generated object. Requires that
      	the object supply a valid apiVersion field.

          --pod-running-timeout=1m0s:
      	The length of time (like 5s, 2m, or 3h, higher than zero) to wait
      	until at least one pod is running

          --port='':
      	The port that this container exposes.

          --privileged=false:
      	If true, run the container in privileged mode.

          -q, --quiet=false:
      	If true, suppress prompt messages.

          -R, --recursive=false:
      	Process the directory used in -f, --filename recursively. Useful when
      	you want to manage related manifests organized within the same
      	directory.

          --restart='Always':
      	The restart policy for this Pod.  Legal values [Always, OnFailure,
      	Never].

          --rm=false:
      	If true, delete the pod after it exits.  Only valid when attaching to
      	the container, e.g. with '--attach' or with '-i/--stdin'.

          --save-config=false:
      	If true, the configuration of current object will be saved in its
      	annotation. Otherwise, the annotation will be unchanged. This flag is
      	useful when you want to perform kubectl apply on this object in the
      	future.

          --show-managed-fields=false:
      	If true, keep the managedFields when printing objects in JSON or YAML
      	format.

          -i, --stdin=false:
      	Keep stdin open on the container in the pod, even if nothing is
      	attached.

          --template='':
      	Template string or path to template file to use when -o=go-template,
      	-o=go-template-file. The template format is golang templates
      	[http://golang.org/pkg/text/template/#pkg-overview].

          --timeout=0s:
      	The length of time to wait before giving up on a delete, zero means
      	determine a timeout from the size of the object

          -t, --tty=false:
      	Allocate a TTY for the container in the pod.

          --wait=false:
      	If true, wait for resources to be gone before returning. This waits
      	for finalizers.

      Usage:
        kubectl run NAME --image=image [--env="key=value"] [--port=port]
      [--dry-run=server|client] [--overrides=inline-json] [--command] -- [COMMAND]
      [args...] [options]

      Use "kubectl options" for a list of global command-line options (applies to all
      commands).
  - run: kubectl create deployment --help
    tty: true
    cols: 80
    exit: 0
    output: |
      Create a deployment with the specified name.

      Aliases:
      deployment, deploy

      Examples:
        # Create a deployment named my-dep that runs the busybox image
        kubectl create deployment my-dep --image=busybox
        
        # Create a deployment with a command
        kubectl create deployment my-dep --image=busybox -- date
        
        # Create a deployment named my-dep that runs the nginx image with 3 replicas
        kubectl create deployment my-dep --image=nginx --replicas=3
        
        # Create a deployment named my-dep that runs the busybox image and expose port
      5701
        kubectl create deployment my-dep --image=busybox --port=5701
        
        # Create a deployment named my-dep that runs multiple containers
        kubectl create deployment my-dep --image=busybox:latest --image=ubuntu:latest
      --image=nginx

      Options:
          --allow-missing-template-keys=true:
      	If true, ignore any errors in templates when a field or map key is
      	missing in the template. Only applies to golang and jsonpath output
      	formats.

          --dry-run='none':
      	Must be "none", "server", or "client". If client strategy, only print
      	the object that would be sent, without sending it. If server strategy,
      	submit server-side request without persisting the resource.

          --field-manager='kubectl-create':
      	Name of the manager used to track field ownership.

          --image=[]:
      	Image names to run. A deployment can have multiple images set for
      	multi-container pod.

          -o, --output='':
      	Output format. One of: (json, yaml, kyaml, name, go-template,
      	go-template-file, template, templatefile, jsonpath, jsonpath-as-json,
      	jsonpath-file).

          --port=-1:
      	The containerPort that this deployment exposes.

          -r, --replicas=1:
      	Number of replicas to create. Default is 1.

          --save-config=false:
      	If true, the configuration of current object will be saved in its
      	annotation. Otherwise, the annotation will be unchanged. This flag is
      	useful when you want to perform kubectl apply on this object in the
      	future.

          --show-managed-fields=false:
      	If true, keep the managedFields when printing objects in JSON or YAML
      	format.

          --template='':
      	Template string or path to template file to use when -o=go-template,
      	-o=go-template-file. The template format is golang templates
      	[http://golang.org/pkg/text/template/#pkg-overview].

          --validate='strict':
      	Must be one of: strict (or true), warn, ignore (or false). "true" or
      	"strict" will use a schema to validate the input and fail the request
      	if invalid. It will perform server side validation if
      	ServerSideFieldValidation is enabled on the api-server, but will fall
      	back to less reliable client-side validation if not. "warn" will warn
      	about unknown or duplicate fields without blocking the request if
      	server-side field validation is enabled on the API server, and behave
      	as "ignore" otherwise. "false" or "ignore" will not perform any schema
      	validation, silently dropping any unknown or duplicate fields.

      Usage:
        kubectl create deployment NAME --image=image -- [COMMAND] [args...] [options]

      Use "kubectl options" for a list of global command-line options (applies to all
      commands).
  - run: kubectl expose --help
    tty: true
    cols: 80
    exit: 0
    output: |
      Expose a resource as a new Kubernetes service.

       Looks up a deployment, service, replica set, replication controller or pod by
      name and uses the selector for that resource as the selector for a new service
      on the specified port. A deployment or replica set will be exposed as a service
      only if its selector is convertible to a selector that service supports, i.e.
      when the selector contains only the matchLabels component. Note that if no port
      is specified via --port and the exposed resource has multiple ports, all will be
      re-used by the new service. Also if no labels are specified, the new service
      will re-use the labels from the resource it exposes.

       Possible resources include (case insensitive):

       pod (po), service (svc), replicationcontroller (rc), deployment (deploy),
      replicaset (rs)

      Examples:
        # Create a service for a replicated nginx, which serves on port 80 and
      connects to the containers on port 8000
        kubectl expose rc nginx --port=80 --target-port=8000
        
        # Create a service for a replication controller identified by type and name
      specified in "nginx-controller.yaml", which serves on port 80 and connects to
      the containers on port 8000
        kubectl expose -f nginx-controller.yaml --port=80 --target-port=8000
        
        # Create a service for a pod valid-pod, which serves on port 444 with the name
      "frontend"
        kubectl expose pod valid-pod --port=444 --name=frontend
        
        # Create a second service based on the above service, exposing the container
      port 8443 as port 443 with the name "nginx-https"
        kubectl expose service nginx --port=443 --target-port=8443 --name=nginx-https
        
        # Create a service for a replicated streaming application on port 4100
      balancing UDP traffic and named 'video-stream'.
        kubectl expose rc streamer --port=4100 --protocol=UDP --name=video-stream
        
        # Create a service for a replicated nginx using replica set, which serves on
      port 80 and connects to the containers on port 8000
        kubectl expose rs nginx --port=80 --target-port=8000
        
        # Create a service for an nginx deployment, which serves on port 80 and
      connects to the containers on port 8000
        kubectl expose deployment nginx --port=80 --target-port=8000

      Options:
          --allow-missing-template-keys=true:
      	If true, ignore any errors in templates when a field or map key is
      	missing in the template. Only applies to golang and jsonpath output
      	formats.

          --cluster-ip='':
      	ClusterIP to be assigned to the service. Leave empty to auto-allocate,
      	or set to 'None' to create a headless service.

          --dry-run='none':
      	Must be "none", "server", or "client". If client strategy, only print
      	the object that would be sent, without sending it. If server strategy,
      	submit server-side request without persisting the resource.

          --external-ip='':
      	Additional external IP address (not managed by Kubernetes) to accept
      	for the service. If this IP is routed to a node, the service can be
      	accessed by this IP in addition to its generated service IP.

          --field-manager='kubectl-expose':
      	Name of the manager used to track field ownership.

          -f, --filename=[]:
      	Filename, directory, or URL to files identifying the resource to
      	expose a service

          -k, --kustomize='':
      	Process the kustomization directory. This flag can't be used together
      	with -f or -R.

          -l, --labels='':
      	Labels to apply to the service created by this call.

          --load-balancer-ip='':
      	IP to assign to the LoadBalancer. If empty, an ephemeral IP will be
      	created and used (cloud-provider specific).

          --name='':
      	The name for the newly created object.

          -o, --output='':
      	Output format. One of: (json, yaml, kyaml, name, go-template,
      	go-template-file, template, templatefile, jsonpath, jsonpath-as-json,
      	jsonpath-file).

          --override-type='merge':
      	The method used to override the generated object: json, merge, or
      	strategic.

          --overrides='':
      	An inline JSON override for the generated object. If this is
      	non-empty, it is used to override the generated object. Requires that
      	the object supply a valid apiVersion field.

          --port='':
      	The port that the service should serve on. Copied from the resource
      	being exposed, if unspecified

          --protocol='':
      	The network protocol for the service to be created. Default is 'TCP'.

          -R, --recursive=false:
      	Process the directory used in -f, --filename recursively. Useful when
      	you want to manage related manifests organized within the same
      	directory.

          --save-config=false:
      	If true, the configuration of current object will be saved in its
      	annotation. Otherwise, the annotation will be unchanged. This flag is
      	useful when you want to perform kubectl apply on this object in the
      	future.

          --selector='':
      	A label selector to use for this service. Only equality-based selector
      	requirements are supported. If empty (the default) infer the selector
      	from the resource being exposed.

          --session-affinity='':
      	If non-empty, set the session affinity for the service to this; legal
      	values: 'None', 'ClientIP'

          --show-managed-fields=false:
      	If true, keep the managedFields when printing objects in JSON or YAML
      	format.

          --target-port='':
      	Name or number for the port on the container that the service should
      	direct traffic to. Optional.

          --template='':
      	Template string or path to template file to use when -o=go-template,
      	-o=go-template-file. The template format is golang templates
      	[http://golang.org/pkg/text/template/#pkg-overview].

          --type='':
      	Type for this service: ClusterIP, NodePort, LoadBalancer, or
      	ExternalName. Default is 'ClusterIP'.

      Usage:
        kubectl expose (-f FILENAME | TYPE NAME) [--port=port]
      [--protocol=TCP|UDP|SCTP] [--target-port=number-or-name] [--name=name]
      [--external-ip=external-ip-of-service] [--type=type] [options]

      Use "kubectl options" for a list of global command-line options (applies to all
      commands).
  - run: kubectl options
    tty: true
    cols: 80
    exit: 0
    output: |+
      The following options can be passed to any command:

          --as='':
      	Username to impersonate for the operation. User could be a regular
      	user or a service account in a namespace.

          --as-group=[]:
      	Group to impersonate for the operation, this flag can be repeated to
      	specify multiple groups.

          --as-uid='':
