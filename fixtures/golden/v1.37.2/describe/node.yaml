case: describe/node
description: describe node with roles, taints, a cordon and Pods with requests and limits (their share of allocatable, the totals); several Nodes by label and by prefix; a missing Node.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
