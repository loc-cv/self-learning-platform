description: >-
  How kubectl writes values with -o yaml and -o json (sigs.k8s.io/yaml over yaml.v2, encoding/json):
  quoting of YAML 1.1 words, numbers, timestamps and indicators, literal blocks, folding at 80
  columns, escapes, natural key order, and the control-character failure. Client-side generators
  print typed objects, so -o json keeps struct field order.
server: false
files:
  multi.txt: "first line\nsecond line\n"
  nonl.txt: "no trailing newline\nsecond"
  blank.txt: "\n\nafter two blank lines\n\n"
  spaces.txt: "  indented first line\nnext\n"
  trailing-space.txt: "line with trailing space \nnext\n"
  long.txt: "This line is long enough that a literal block keeps it whole even though it runs past eighty columns.\n"
steps:
  - run: >-
      kubectl create configmap words --dry-run=client -o yaml
      --from-literal=yes=yes --from-literal=no=no --from-literal=on=on --from-literal=off=OFF
      --from-literal=y=y --from-literal=n=N --from-literal=true=True --from-literal=false=false
      --from-literal=null=null --from-literal=tilde='~' --from-literal=empty=
      --from-literal=merge='<<' --from-literal=equals='='
    normalize: false
  - run: >-
      kubectl create configmap numbers --dry-run=client -o yaml
      --from-literal=int=1 --from-literal=neg=-1 --from-literal=plus=+1 --from-literal=quoted='"1"'
      --from-literal=hex=0x1F --from-literal=octal=012 --from-literal=eight=08 --from-literal=oct2=0o17
      --from-literal=bin=0b101 --from-literal=under=1_000 --from-literal=float=1.5 --from-literal=exp=1e3
      --from-literal=dot=.5 --from-literal=inf=.inf --from-literal=nan=.NaN --from-literal=big=99999999999999999999
      --from-literal=huge=1e400 --from-literal=ip=10.0.0.1 --from-literal=version=1.37.2
      --from-literal=time=12:30:45 --from-literal=base60=190:20:30 --from-literal=port=8080:80
    normalize: false
  - run: >-
      kubectl create configmap dates --dry-run=client -o yaml
      --from-literal=date=2024-01-01 --from-literal=short=2024-1-2 --from-literal=rfc3339=2024-01-01T10:00:00Z
      --from-literal=lower=2024-01-01t10:00:00+02:00 --from-literal=spaced='2024-01-01 10:00:00'
      --from-literal=frac=2024-01-01T10:00:00.123456789012Z --from-literal=badmonth=2024-13-01
      --from-literal=badday=2024-02-30 --from-literal=leap=2024-02-29 --from-literal=noleap=2023-02-29
      --from-literal=year5=20240-01-01
    normalize: false
  - run: >-
      kubectl create configmap indicators --dry-run=client -o yaml
      --from-literal=lead=' lead' --from-literal=trail='trail ' --from-literal=colon='a: b'
      --from-literal=colon2='a:b' --from-literal=colonend='a:' --from-literal=hash='a #b'
      --from-literal=hash2='a#b' --from-literal=hash3='#x' --from-literal=dash='- x'
      --from-literal=dash2='-x' --from-literal=dashonly='-' --from-literal=q="'x" --from-literal=dq='"x'
      --from-literal=it="it's" --from-literal=brace='{x}' --from-literal=bracket='[x]' --from-literal=comma='x,y'
      --from-literal=star='*x' --from-literal=amp='&x' --from-literal=bang='!x' --from-literal=pct='%x'
      --from-literal=at='@x' --from-literal=bt='`x' --from-literal=pipe='|x' --from-literal=gt='>x'
      --from-literal=question='?x' --from-literal=question2='? x' --from-literal=docstart=--- --from-literal=dots=...
      --from-literal=url='http://example.com/a?b=c&d=e#f' --from-literal=backslash='a\b'
    normalize: false
  - run: >-
      kubectl create configmap escapes --dry-run=client -o yaml
      --from-literal=tab=$'a\tb' --from-literal=cr=$'a\rb' --from-literal=bell=$'a\ab'
      --from-literal=esc=$'a\eb' --from-literal=unicode='日本語 tiếng Việt' --from-literal=emoji='😀 ok'
      --from-literal=nbsp=$'a b' --from-literal=ls=$'a b' --from-literal=bom=$'﻿ab'
      --from-literal=html='<b>&amp;</b>' --from-literal=quote='say "hi"'
    normalize: false
  - run: >-
      kubectl create configmap blocks --dry-run=client -o yaml
      --from-literal=multi=$'l1\nl2' --from-literal=multitrail=$'l1\nl2\n' --from-literal=keep=$'l1\nl2\n\n'
      --from-literal=leadnl=$'\nx' --from-literal=leadspace=$' x\ny' --from-literal=spacenl=$'a \nb'
      --from-literal=nlspace=$'a\n b' --from-literal=tabbed=$'a\n\tb' --from-literal=onlynl=$'\n'
      --from-file=multi.txt --from-file=nonl.txt --from-file=blank.txt --from-file=spaces.txt
      --from-file=trailing-space.txt --from-file=long.txt
    normalize: false
  - run: >-
      kubectl create configmap folding --dry-run=client -o yaml
      --from-literal=long='lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua'
      --from-literal=longnospace=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      --from-literal=longdouble='"quoted at the start so it needs quotes, and long enough to fold past the eighty column limit of yaml.v2'
      --from-literal=longsingle=' leading space makes this single-quoted, and it is long enough to fold past the eighty column limit too'
      --from-literal=twospaces='words  separated  by  two  spaces  fold  only  at  a  single  space  so  this  line  runs  on  past  eighty'
      --from-literal=longtab=$'a tab\there makes it double-quoted and it is long enough to fold past the eighty column limit of the emitter'
    normalize: false
  - run: >-
      kubectl create configmap keys --dry-run=client -o yaml
      --from-literal=a10=x --from-literal=a9=x --from-literal=a1=x --from-literal=a01=x --from-literal=a001=x
      --from-literal=a0=x --from-literal=A=x --from-literal=Z=x --from-literal=_x=x --from-literal=x_=x
      --from-literal=1=x --from-literal=10=x --from-literal=9=x --from-literal=01=x --from-literal=-1=x
      --from-literal=a.1=x --from-literal=a-1=x --from-literal=b1c10=x --from-literal=b1c2=x
      --from-literal=x9y=x --from-literal=x10y=x --from-literal=0=x --from-literal=00=x --from-literal=.dot=x
      --from-literal=y=x
    normalize: false
  - run: >-
      kubectl create configmap escapes --dry-run=client -o json
      --from-literal=tab=$'a\tb' --from-literal=cr=$'a\rb' --from-literal=bell=$'a\ab' --from-literal=del=$'a\x7fb'
      --from-literal=multi=$'l1\nl2\n' --from-literal=unicode='日本語' --from-literal=emoji='😀'
      --from-literal=ls=$'a b' --from-literal=html='<b>&amp;</b>' --from-literal=quote='say "hi"'
      --from-literal=backslash='a\b' --from-literal=10=x --from-literal=9=x --from-literal=a=x
    normalize: false
  - run: kubectl create deployment web --image=nginx:1.27 --replicas=2 --dry-run=client -o json
    normalize: false
  - run: kubectl create configmap del --from-literal=del=$'a\x7fb' --dry-run=client -o yaml
    normalize: false
  - run: kubectl create configmap nel --from-literal=nel=$'a\u0085b' --dry-run=client -o yaml
    normalize: false
