case: create/from-files
description: "kubectl create -f: standard input, multi-document YAML, a JSON object, a JSON stream and a JSON List, directories with and without -R, already-exists among several objects, output formats, dry runs, namespaces, selectors, and the errors of reading and decoding manifests."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
steps:
  - run: kubectl create -f -
    stdin: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: from-stdin
    exit: 0
    stdout: |
      configmap/from-stdin created
    stderr: ""
  - run: kubectl create -f multi.yaml
    exit: 0
    stdout: |
      configmap/multi-a created
      configmap/multi-b created
    stderr: ""
  - run: kubectl create -f multi.yaml
    exit: 1
    stdout: ""
    stderr: |
      Error from server (AlreadyExists): error when creating "multi.yaml": configmaps "multi-a" already exists
      Error from server (AlreadyExists): error when creating "multi.yaml": configmaps "multi-b" already exists
  - run: kubectl create -f one.json -o yaml
    exit: 0
    stdout: |
      apiVersion: v1
      data:
        k: v
      kind: ConfigMap
      metadata:
        annotations:
          note: <b>&</b>
        creationTimestamp: "<<time>>"
        name: from-json
        namespace: default
        resourceVersion: "<<rv>>"
        uid: <<uid:1>>
    stderr: ""
  - run: kubectl create -f stream.json -o name
    exit: 0
    stdout: |
      configmap/stream-a
      configmap/stream-b
    stderr: ""
  - run: kubectl create -f list.json
