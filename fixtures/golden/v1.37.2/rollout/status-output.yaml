# Format and normalization tokens: docs/FIDELITY.md §6.
case: rollout/status-output
description: "rollout status once settled with --timeout (positive, and negative: klog's error, then no timeout), several objects, another namespace, a missing namespace and DaemonSet; and the objects pause, resume and undo print with -o yaml and -o json."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
steps:
  - run: kubectl rollout status deployment/web --timeout=30s
    exit: 0
    stdout: |
      deployment "web" successfully rolled out
    stderr: ""
  - run: kubectl rollout status deployment/web --timeout=-5s
    exit: 0
    stdout: |
      deployment "web" successfully rolled out
    stderr: |
      E<<time>> <<pid>> until.go:159] "Timeout for context shall not be negative"
  - run: kubectl rollout status deployment/web deployment/api
    exit: 1
    stdout: |
      deployment "web" successfully rolled out
    stderr: |
      Error from server (NotFound): deployments.apps "api" not found
  - run: kubectl rollout status deployment/api -n other
    exit: 0
    stdout: |
      deployment "api" successfully rolled out
    stderr: ""
  - run: kubectl rollout status deployment/api -n missing
    exit: 1
    stdout: ""
    stderr: |
      Error from server (NotFound): namespaces "missing" not found
  - run: kubectl rollout status daemonset/nope
    exit: 1
    stdout: ""
    stderr: |
      Error from server (NotFound): daemonsets.apps "nope" not found
  - run: kubectl rollout status deployment/web -w=false --revision=1
    exit: 0
    stdout: |
      deployment "web" successfully rolled out
    stderr: ""
