case: scheduling/preemption
description: Both workers too full for a 1-CPU Pod although it fits their allocatable, so preemption is tried and finds no lower-priority victim; the same with preemptionPolicy Never (which needs a PriorityClass); both are scheduled on node02 once the Pod using it is deleted.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
