# Format and normalization tokens: docs/FIDELITY.md §6.
case: generate/run
description: "kubectl run against a server: client and server dry runs across its flags (-o yaml|json|name), --expose, --overrides of each type and their errors, real creates with --save-config, and the API server's errors (AlreadyExists, an invalid name, a missing namespace, an existing Service)."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
steps:
  - run: kubectl run nginx --image=nginx:1.27 --dry-run=client -o yaml
    exit: 0
    stdout: |
      apiVersion: v1
      kind: Pod
      metadata:
        labels:
          run: nginx
        name: nginx
      spec:
        containers:
        - image: nginx:1.27
          name: nginx
          resources: {}
        dnsPolicy: ClusterFirst
        restartPolicy: Always
      status: {}
    stderr: ""
