description: >-
  kubectl set image - one container, init containers (--local: the simulated kubelet runs none yet), `*`, several pairs, a Pod, selectors and
  --all, an unchanged image (nothing printed), client and server dry runs, --local with -o yaml and
  -o json, -f against the server; and the errors - a container that is not there (alone and next to
  one that is), a kind without a Pod template, `*` with other pairs, no image, no resource, pairs
  before resources, a bad pair, a missing object, the --local mistakes.
files:
  web.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
      labels:
        app: web
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: web
      template:
        metadata:
          labels:
            app: web
        spec:
          containers:
          - name: nginx
            image: nginx:1.27
          - name: sidecar
            image: busybox:1.36
            command: ["sleep", "3600"]
  local.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: loc
      labels:
        app: loc
    spec:
      selector:
        matchLabels:
          app: loc
      template:
        metadata:
          labels:
            app: loc
        spec:
          initContainers:
          - name: init
            image: busybox:1.36
            command: ["true"]
          containers:
          - name: nginx
            image: nginx:1.27
            unknownField: dropped
setup:
  - do: kubectl create -f web.yaml
  - do: kubectl create deployment api --image=nginx:1.27
  - do: kubectl create configmap settings --from-literal=a=b
  - do: kubectl run solo --image=nginx:1.27
  - do: kubectl rollout status deployment/web --timeout=60s
  - do: kubectl rollout status deployment/api --timeout=60s
steps:
  - run: kubectl set image deployment/web nginx=nginx:1.28
  - do: kubectl rollout status deployment/web --timeout=60s
  - run: kubectl set image deployment/web nginx=nginx:1.28
  - run: kubectl set image deployment/web nope=nginx:1.28
  - run: kubectl set image deployment/web nginx=nginx:1.29 nope=busybox
  - do: kubectl rollout status deployment/web --timeout=60s
  - run: kubectl set image deployment/web sidecar=busybox:1.37
  - do: kubectl rollout status deployment/web --timeout=60s
  - run: kubectl set image deployment/web '*=nginx:1.27' sidecar=busybox
  - run: kubectl set image deployment/web nginx=nginx:1.30 --dry-run=client
  - run: kubectl set image deployment/web nginx=nginx:1.30 --dry-run=server -o name
  - run: kubectl set image deployment web
  - run: kubectl set image nginx=nginx:1.30
  - run: kubectl set image deployment/web nginx=nginx:1.30 api
  - run: kubectl set image deployment/web =nginx:1.30
  - run: kubectl set image deployment/web nginx- other
  - run: kubectl set image pod solo solo=nginx:1.28
  - run: kubectl set image configmap/settings a=b
  - run: kubectl set image configmap/settings deployment/api a=b
  - run: kubectl set image deploy -l app=web nginx=nginx:1.27
  - do: kubectl rollout status deployment/web --timeout=60s
  - run: kubectl set image deploy --all nginx=nginx:1.28
  - do: kubectl rollout status deployment/web --timeout=60s
  - do: kubectl rollout status deployment/api --timeout=60s
  - run: kubectl set image deploy --all -l app=web nginx=nginx:1.27
  - run: kubectl set image deploy/web deploy/nope nginx=nginx:1.27
  - run: kubectl set image --local -f local.yaml nginx=nginx:2 -o yaml
  - run: kubectl set image --local -f local.yaml nginx=nginx:2 -o json
  - run: kubectl set image --local -f local.yaml init=busybox:1.37 -o yaml
  - run: kubectl set image --local -f local.yaml '*=busybox:1.37' -o yaml
  - run: kubectl set image --local -f local.yaml nginx=nginx:2
  - run: kubectl set image --local -f local.yaml nginx=nginx:2 --dry-run=client
  - run: kubectl set image --local deploy/web nginx=nginx:2
  - run: kubectl set image --local nginx=nginx:2
  - run: kubectl set image --local -f local.yaml nginx=nginx:2 --dry-run=server
  - run: kubectl set image -f local.yaml nginx=nginx:2
  - run: kubectl set image deployment/web nginx=nginx:1.27 -o bogus
  - until: kubectl get pods -l app=web -o name | wc -l
    match: '^1$'
  - until: kubectl get deployment web -o jsonpath={.status.terminatingReplicas}
    match: '^0?$'
  - objects: [deployment/web]
