case: logs/before-the-kubelet
description: "kubectl logs up to the point where the API server would contact a kubelet: argument and flag validation, the builder's errors, LogsForObject's container choice and its messages (the default container annotation, \"Defaulted container\", \"Found N pods\"), the --max-log-requests check, the API server's PodLogOptions validation, and the empty answer for Pods with no node."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
