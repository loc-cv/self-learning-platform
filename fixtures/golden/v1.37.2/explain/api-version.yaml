        metadata	<ObjectMeta>
          metadata is the standard object metadata. More info:
          https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

        spec	<HorizontalPodAutoscalerSpec> -required-
          spec defines the behaviour of autoscaler. More info:
          https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status.

        status	<HorizontalPodAutoscalerStatus>
          status is the current information about the autoscaler.


    stderr: ""
  - run: kubectl explain hpa.spec --api-version autoscaling/v1
    exit: 0
    stdout: |+
      GROUP:      autoscaling
      KIND:       HorizontalPodAutoscaler
      VERSION:    v1

      FIELD: spec <HorizontalPodAutoscalerSpec>


      DESCRIPTION:
          spec defines the behaviour of autoscaler. More info:
          https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status.
          specification of a horizontal pod autoscaler.
          
      FIELDS:
        maxReplicas	<integer> -required-
          maxReplicas is the upper limit for the number of pods that can be set by the
          autoscaler; cannot be smaller than MinReplicas.

        minReplicas	<integer>
          minReplicas is the lower limit for the number of replicas to which the
          autoscaler can scale down.  It defaults to 1 pod.  minReplicas is allowed to
          be 0 if the alpha feature gate HPAScaleToZero is enabled and at least one
          Object or External metric is configured.  Scaling is active as long as at
          least one metric value is available.

        scaleTargetRef	<CrossVersionObjectReference> -required-
          scaleTargetRef is the reference to scaled resource; horizontal pod
          autoscaler will learn the current resource consumption and will set the
          desired number of pods by using its Scale subresource.

        targetCPUUtilizationPercentage	<integer>
          targetCPUUtilizationPercentage is the target average CPU utilization
          (represented as a percentage of requested CPU) over all the pods; if not
          specified the default autoscaling policy will be used.


    stderr: ""
  - run: kubectl explain events --api-version=events.k8s.io/v1
    exit: 0
    stdout: |+
      GROUP:      events.k8s.io
      KIND:       Event
      VERSION:    v1

      DESCRIPTION:
          Event is a report of an event somewhere in the cluster. It generally denotes
          some state change in the system. Events have a limited retention time and
          triggers and messages may evolve with time.  Event consumers should not rely
          on the timing of an event with a given Reason reflecting a consistent
          underlying trigger, or the continued existence of events with that Reason.
          Events should be treated as informative, best-effort, supplemental data.
          
      FIELDS:
