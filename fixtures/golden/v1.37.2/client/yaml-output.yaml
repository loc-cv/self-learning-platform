  - run: kubectl create configmap escapes --dry-run=client -o json --from-literal=tab=$'a\tb' --from-literal=cr=$'a\rb' --from-literal=bell=$'a\ab' --from-literal=del=$'a\x7fb' --from-literal=multi=$'l1\nl2\n' --from-literal=unicode='日本語' --from-literal=emoji='😀' --from-literal=ls=$'a b' --from-literal=html='<b>&amp;</b>' --from-literal=quote='say "hi"' --from-literal=backslash='a\b' --from-literal=10=x --from-literal=9=x --from-literal=a=x
