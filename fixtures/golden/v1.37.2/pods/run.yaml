# Captured from fixtures/golden/cases/pods/run.yaml by npm run golden:capture. Do not edit.
# Format and normalization tokens: docs/FIDELITY.md §6.
case: pods/run
description: Create a Pod with kubectl run and read it in each output format; describe it.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
steps:
  - run: kubectl get pods
    exit: 0
    stdout: |
      NAME    READY   STATUS    RESTARTS   AGE
      nginx   1/1     Running   0          <<age>>
    stderr: ""
    kwok: true
  - run: kubectl get pods -o wide
    exit: 0
    stdout: |
      NAME    READY   STATUS    RESTARTS   AGE       IP       NODE       NOMINATED NODE   READINESS GATES
      nginx   1/1     Running   0          <<age>>   <<ip>>   <<node>>   <none>           <none>
    stderr: ""
    kwok: true
    anyWorker: true
  - run: kubectl get pod nginx -o yaml
    exit: 0
    stdout: |
      apiVersion: v1
      kind: Pod
      metadata:
        creationTimestamp: "<<time>>"
        generation: 1
        labels:
          app: web
        name: nginx
        namespace: default
        resourceVersion: "<<rv>>"
        uid: <<uid:1>>
      spec:
        containers:
        - image: nginx:1.27
          imagePullPolicy: IfNotPresent
          name: nginx
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            name: kube-api-access-<<suffix>>
            readOnly: true
        dnsPolicy: ClusterFirst
        enableServiceLinks: true
        nodeName: <<node>>
        preemptionPolicy: PreemptLowerPriority
        priority: 0
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        serviceAccount: default
        serviceAccountName: default
        terminationGracePeriodSeconds: 30
        tolerations:
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 300
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 300
        volumes:
        - name: kube-api-access-<<suffix>>
          projected:
            defaultMode: 420
            sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                items:
                - key: ca.crt
                  path: ca.crt
                name: kube-root-ca.crt
            - downwardAPI:
                items:
                - fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
                  path: namespace
      status:
        conditions:
        - lastProbeTime: null
          lastTransitionTime: "<<time>>"
          status: "True"
          type: Initialized
        - lastProbeTime: null
          lastTransitionTime: "<<time>>"
          status: "True"
          type: Ready
        - lastProbeTime: null
          lastTransitionTime: "<<time>>"
          status: "True"
          type: ContainersReady
        - lastProbeTime: null
          lastTransitionTime: "<<time>>"
          status: "True"
          type: PodScheduled
        containerStatuses:
        - image: nginx:1.27
          imageID: ""
          lastState: {}
          name: nginx
          ready: true
          restartCount: 0
          state:
            running:
              startedAt: "<<time>>"
        hostIP: <<ip>>
        hostIPs:
        - ip: <<ip>>
        phase: Running
        podIP: <<ip>>
        podIPs:
        - ip: <<ip>>
        qosClass: BestEffort
        startTime: "<<time>>"
    stderr: ""
    kwok: true
    anyWorker: true
  - run: kubectl get pod nginx -o json
    exit: 0
    stdout: |
      {
