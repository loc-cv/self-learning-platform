apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
spec:
  containers:
  - name: nginx
    image: nginx:1.31.8
---
apiVersion: v1
kind: Pod
metadata:
  name: crash
  labels:
    app: crash
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo starting; echo 'cannot open /etc/app.conf' >&2; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pair
spec:
  containers:
  - name: main
    image: busybox:1.36
    command: ["sh", "-c", "echo main up; sleep 3600"]
  - name: helper
    image: busybox:1.36
    command: ["sh", "-c", "echo helper up; sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: typo
spec:
  containers:
  - name: app
    image: busybox:1.36-typo
---
apiVersion: v1
kind: Pod
metadata:
  name: clock
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo tick $i; sleep 10; done"]
