  - run: kubectl set image --local deploy/web nginx=nginx:2
    exit: 1
    stdout: ""
    stderr: |
      error: you must specify resources by --filename when --local is set.
      Example resource specifications include:
         '-f rsrc.yaml'
         '--filename=rsrc.json'
  - run: kubectl set image --local nginx=nginx:2
    exit: 1
