case: rollout/history-undo
description: "A Deployment applied three times (two images with a change-cause annotation, a third without), then rollout status once settled (--revision, --watch=false and their errors), rollout history (the table, --revision with the pod template and the change-cause, -o name/yaml, selectors, a type with no history viewer), rollout undo (client and server dry runs, --to-revision, the warning about the last-applied annotation, the skipped rollback, -o name, the errors) and the objects the rollbacks leave: the change-cause copied back onto the Deployment, revision-history on the ReplicaSet."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
