# Format and normalization tokens: docs/FIDELITY.md §6.
case: generate/create
description: "The create generators against a server: real creates printed as the typed client returns them (-o json keeps struct order), server dry runs, --save-config, -n, objects read back with get -o yaml, and the API server's errors behind each command's own prefix (AlreadyExists, invalid names and values, a missing namespace, a taken node port)."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
