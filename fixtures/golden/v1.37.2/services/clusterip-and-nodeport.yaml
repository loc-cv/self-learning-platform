      - ref: service/kubernetes
        object:
          apiVersion: v1
          kind: Service
          metadata:
            creationTimestamp: <<time>>
            labels:
              component: apiserver
              provider: kubernetes
            name: kubernetes
            namespace: default
            resourceVersion: <<rv>>
            uid: <<uid:3>>
          spec:
            clusterIP: 10.96.0.1
            clusterIPs:
              - 10.96.0.1
            internalTrafficPolicy: Cluster
            ipFamilies:
              - IPv4
            ipFamilyPolicy: SingleStack
            ports:
              - name: https
                port: 443
                protocol: TCP
                targetPort: 6443
            sessionAffinity: None
            type: ClusterIP
          status:
            loadBalancer: {}
