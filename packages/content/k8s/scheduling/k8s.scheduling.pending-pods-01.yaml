id: k8s.scheduling.pending-pods-01
kind: lab
title: A new Deployment whose Pods never start
skills:
  - k8s.troubleshooting.pending-pods
  - k8s.scheduling.taints
  - k8s.scheduling.node-selection
  - k8s.scheduling.resource-requests
curriculum:
  - cka.workloads.pod-scheduling
  - cka.troubleshooting.clusters-nodes
  - ckad.config.resource-requirements
  - ckad.observability.debugging
difficulty: 2
targetMinutes: 8
world:
  topology: kubeadm-1cp-2w
  params:
    ns: { pick: [shop, billing, media] }
    app: { pick: [reports, worker, indexer] }
    replicas: { int: { min: 2, max: 3 } }
    ssdNode: { pick: [node01, node02] }
    cause: { pick: [taint, selector, memory] }
  setup:
    - run: kubectl label node {{ssdNode}} disktype=ssd
    # The platform team reserved the SSD node for this namespace's team.
    - run: kubectl edit node {{ssdNode}}
      when: { cause: taint }
      editor:
        - replace:
            from: "spec:\n  podCIDR:"
            to: "spec:\n  taints:\n  - effect: NoSchedule\n    key: dedicated\n    value: {{ns}}\n  podCIDR:"
    - apply: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: {{ns}}
    - apply: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: {{app}}
          namespace: {{ns}}
        spec:
          replicas: {{replicas}}
          selector:
            matchLabels:
              app: {{app}}
          template:
            metadata:
              labels:
                app: {{app}}
            spec:
              nodeSelector:
                disktype: ssd
              containers:
                - name: {{app}}
                  image: nginx:1.31.8
                  resources:
                    requests:
                      memory: 256Mi
      when: { cause: taint }
    - apply: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: {{app}}
          namespace: {{ns}}
        spec:
          replicas: {{replicas}}
          selector:
            matchLabels:
              app: {{app}}
          template:
            metadata:
              labels:
                app: {{app}}
            spec:
              nodeSelector:
                disktype: SSD
              containers:
                - name: {{app}}
                  image: nginx:1.31.8
                  resources:
                    requests:
                      memory: 256Mi
      when: { cause: selector }
    - apply: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: {{app}}
          namespace: {{ns}}
        spec:
          replicas: {{replicas}}
          selector:
            matchLabels:
              app: {{app}}
          template:
            metadata:
              labels:
                app: {{app}}
            spec:
              nodeSelector:
                disktype: ssd
              containers:
                - name: {{app}}
                  image: nginx:1.31.8
                  resources:
                    requests:
                      memory: 8Gi
      when: { cause: memory }
    - until:
        assert: k8s.object
        with:
          kind: Pod
          namespace: "{{ns}}"
          selector: "app={{app}}"
          count: "{{replicas}}"
          where:
            - { path: "{.status.conditions[*].reason}", equals: Unschedulable }
      timeout: 1m
    - advance: 5m
ticket:
  - text: |
      **`{{app}}` never started** (namespace `{{ns}}`)

      The `{{app}}` Deployment was rolled out a few minutes ago, and none of its {{replicas}} Pods has
      started: they are all Pending, and none has been given a node, though all three nodes are
      Ready. Get every replica running.
  - figure:
      kind: view
      of: start
      focus: { scope: "{{ns}}", kinds: [Deployment, Pod, Node] }
      show: []
      caption: "`{{app}}` a few minutes after the rollout."
      alt: >-
        The Deployment {{app}} in namespace {{ns}} has 0 of {{replicas}} Pods ready. All
        {{replicas}} Pods are Pending in the lane of Pods with no node. The three nodes,
        controlplane, node01 and node02, are Ready and run none of them.
  - text: |
      What has to stay true:

      - `{{app}}` needs local SSD storage, so its Pods must only ever run on nodes labelled
        `disktype=ssd`.
      - Each replica requests exactly 256Mi of memory; capacity planning depends on that number.
      - The nodes stay as they are: do not change their labels or taints.
      - Fix the existing Deployment; do not delete and recreate it.
hints:
  - >-
    A Pod stays Pending when the scheduler finds no node for it, and the scheduler says why. Look
    at the events of one of the Pods.
  - text: >-
      The scheduler's message counts the nodes it rejected and gives a reason for each group.
      Compare the taints of the node labelled `disktype=ssd` with what the Pods tolerate.
    when: { cause: taint }
  - text: >-
      The scheduler's message counts the nodes it rejected and gives a reason for each group.
      Compare, character by character, the labels on the nodes with the node selector of the Pods.
    when: { cause: selector }
  - text: >-
      The scheduler's message counts the nodes it rejected and gives a reason for each group.
      Compare what one Pod requests with what a node can allocate (`kubectl describe node`).
    when: { cause: memory }
  - text: >-
      `{{ssdNode}}` carries the taint `dedicated={{ns}}:NoSchedule`. Add a matching toleration to
      the Pod template, for example with `kubectl -n {{ns}} edit deployment {{app}}`: under
      `spec.template.spec`, `tolerations: [{key: dedicated, operator: Equal, value: {{ns}},
      effect: NoSchedule}]`.
    when: { cause: taint }
  - text: >-
      The node label is `disktype=ssd`, the Deployment selects `disktype: SSD`, and labels are
      case-sensitive. `kubectl -n {{ns}} edit deployment {{app}}` and set the node selector to
      `disktype: ssd`.
    when: { cause: selector }
  - text: >-
      Each Pod requests 8Gi of memory and a node can allocate under 4Gi. `kubectl -n {{ns}} edit
      deployment {{app}}` and set `resources.requests.memory` to `256Mi`.
    when: { cause: memory }
checks:
  - id: pods-ready
    title: "All {{replicas}} replicas of `{{app}}` are ready"
    assert: k8s.podsReady
    with: { namespace: "{{ns}}", selector: "app={{app}}", count: "{{replicas}}" }
    within: 2m
    weight: 3
  - id: ssd-only
    title: Pods of `{{app}}` land only on nodes labelled `disktype=ssd`, however many there are
    after:
      - run: kubectl -n {{ns}} scale deployment {{app}} --replicas=6
    assert: k8s.object
    with:
      kind: Pod
      namespace: "{{ns}}"
      selector: "app={{app}}"
      count: 6
      where:
        - { path: "{.spec.nodeName}", equals: "{{ssdNode}}" }
    within: 1m
    weight: 2
  - id: memory-request
    title: Each replica requests 256Mi of memory
    assert: k8s.object
    with:
      kind: Deployment
      namespace: "{{ns}}"
      name: "{{app}}"
      where:
        - { path: "{.spec.template.spec.containers[*].resources.requests.memory}", in: [256Mi, "268435456"] }
  - id: nodes-unchanged
    title: The nodes' labels and taints are as they were
    assert: k8s.unchanged
    with:
      kind: Node
      paths: ["{.metadata.labels}", "{.spec.taints}"]
  - id: deployment-kept
    title: "Deployment `{{app}}` was fixed in place, not recreated"
    assert: k8s.notRecreated
    with: { kind: Deployment, namespace: "{{ns}}", name: "{{app}}" }
solutions:
  - name: Tolerate the taint (kubectl edit)
    when: { cause: taint }
    steps:
      - run: kubectl -n {{ns}} edit deployment {{app}}
        editor:
          - replace:
              from: "      nodeSelector:\n"
              to: "      tolerations:\n      - key: dedicated\n        operator: Equal\n        value: {{ns}}\n        effect: NoSchedule\n      nodeSelector:\n"
      - until:
          assert: k8s.rollout
          with: { namespace: "{{ns}}", name: "{{app}}" }
        timeout: 3m
  - name: Tolerate the taint (apply the corrected manifest)
    when: { cause: taint }
    steps:
      - write:
          path: /root/{{app}}.yaml
          content: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{app}}
              namespace: {{ns}}
            spec:
              replicas: {{replicas}}
              selector:
                matchLabels:
                  app: {{app}}
              template:
                metadata:
                  labels:
                    app: {{app}}
                spec:
                  nodeSelector:
                    disktype: ssd
                  tolerations:
                    - key: dedicated
                      operator: Equal
                      value: {{ns}}
                      effect: NoSchedule
                  containers:
                    - name: {{app}}
                      image: nginx:1.31.8
                      resources:
                        requests:
                          memory: 256Mi
      - run: kubectl apply -f /root/{{app}}.yaml
      - until:
          assert: k8s.rollout
          with: { namespace: "{{ns}}", name: "{{app}}" }
        timeout: 3m
  - name: Correct the node selector
    when: { cause: selector }
    steps:
      - run: kubectl -n {{ns}} edit deployment {{app}}
        editor:
          - replace: { from: "disktype: SSD", to: "disktype: ssd" }
      - until:
          assert: k8s.rollout
          with: { namespace: "{{ns}}", name: "{{app}}" }
        timeout: 3m
  - name: Require the label through node affinity instead
    when: { cause: selector }
    steps:
      - write:
          path: /root/{{app}}.yaml
          content: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{app}}
              namespace: {{ns}}
            spec:
              replicas: {{replicas}}
              selector:
                matchLabels:
                  app: {{app}}
              template:
                metadata:
                  labels:
                    app: {{app}}
                spec:
                  affinity:
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                          - matchExpressions:
                              - key: disktype
                                operator: In
                                values: [ssd]
                  containers:
                    - name: {{app}}
                      image: nginx:1.31.8
                      resources:
                        requests:
                          memory: 256Mi
      - run: kubectl apply -f /root/{{app}}.yaml
      - until:
          assert: k8s.rollout
          with: { namespace: "{{ns}}", name: "{{app}}" }
        timeout: 3m
  - name: Request what a replica needs
    when: { cause: memory }
    steps:
      - run: kubectl -n {{ns}} edit deployment {{app}}
        editor:
          - replace: { from: "memory: 8Gi", to: "memory: 256Mi" }
      - until:
          assert: k8s.rollout
          with: { namespace: "{{ns}}", name: "{{app}}" }
        timeout: 3m
debrief:
  - when: { cause: taint }
    figure:
      kind: compare
      left: { of: start }
      right: { of: solved }
      focus: { scope: "{{ns}}", kinds: [Deployment, ReplicaSet, Pod, Node] }
      show: [Taints, { fact: Labels, keys: [disktype] }, Tolerations]
      notes:
        - on: "Node/{{ssdNode}}"
          text: "The only node the node selector leaves, and it carries the taint `dedicated={{ns}}:NoSchedule`."
        - on: Node/controlplane
          text: kubeadm taints the control plane node, so the scheduler rejected it as well.
        - text: >-
            A real API server also gives every Pod two tolerations, for nodes that are not ready
            or unreachable; the simulator does not add them yet.
          divergence: DIV-043
      caption: >-
        The taint on `{{ssdNode}}` kept every Pod off the only node labelled `disktype=ssd`, until
        the Pod template tolerated it.
      alt: >-
        Left, at the start: {{replicas}} Pods with no toleration wait with no node; {{ssdNode}} is
        labelled disktype=ssd and tainted dedicated={{ns}}:NoSchedule. Right, solved: a new
        ReplicaSet's {{replicas}} Pods tolerate dedicated={{ns}}:NoSchedule and run on
        {{ssdNode}}; the old ReplicaSet has none.
  - when: { cause: selector }
    figure:
      kind: compare
      left: { of: start }
      right: { of: solved }
      focus: { scope: "{{ns}}", kinds: [Deployment, ReplicaSet, Pod, Node] }
      show: [{ fact: Labels, keys: [disktype] }, Node-Selectors, Taints]
      notes:
        - on: "Node/{{ssdNode}}"
          text: "Labelled `disktype=ssd`, in lower case."
        - on: Node/controlplane
          text: kubeadm taints the control plane node, so the scheduler rejected it as well.
      caption: >-
        The node is labelled `disktype=ssd`; the Pods asked for `disktype=SSD`, which no node
        carries.
      alt: >-
        Left, at the start: {{replicas}} Pods whose node selector is disktype=SSD wait with no
        node, while {{ssdNode}} is labelled disktype=ssd. Right, solved: a new ReplicaSet's
        {{replicas}} Pods select disktype=ssd and run on {{ssdNode}}.
  - when: { cause: memory }
    figure:
      kind: compare
      left: { of: start }
      right: { of: solved }
      focus: { scope: "{{ns}}", kinds: [Deployment, ReplicaSet, Pod, Node] }
      show: [Requests, { fact: Labels, keys: [disktype] }, { fact: Allocatable, keys: [memory] }, Taints]
      notes:
        - on: "Node/{{ssdNode}}"
          text: The only node the node selector leaves, and it cannot allocate 8Gi.
        - on: Node/controlplane
          text: kubeadm taints the control plane node, so the scheduler rejected it as well.
      caption: >-
        Each Pod asked for 8Gi of memory, more than any node can allocate; asking for 256Mi, they
        fit on `{{ssdNode}}`.
      alt: >-
        Left, at the start: {{replicas}} Pods requesting memory=8Gi wait with no node; every node
        can allocate less memory than that. Right, solved: a new ReplicaSet's {{replicas}} Pods
        request memory=256Mi and run on {{ssdNode}}.
  - figure:
      kind: diagram
      caption: >-
        For each Pod, the scheduler's filters remove every node it cannot run on, then scoring
        ranks the nodes that are left and the Pod is bound to the best one.
      alt: >-
        A Pending Pod passes three filters in turn, TaintToleration, NodeAffinity and
        NodeResourcesFit, and then scoring.
      entities:
        - { id: pod, shape: process, kind: Pod, label: a new Pod, state: progressing, status: Pending }
        - { id: taints, shape: rule, kind: filter, label: TaintToleration, state: healthy }
        - { id: affinity, shape: rule, kind: filter, label: NodeAffinity, state: healthy }
        - { id: fit, shape: rule, kind: filter, label: NodeResourcesFit, state: healthy }
        - { id: score, shape: rule, kind: score, label: scoring plugins, state: healthy }
      relations:
        - { type: uses, from: pod, to: taints }
        - { type: uses, from: taints, to: affinity }
        - { type: uses, from: affinity, to: fit }
        - { type: uses, from: fit, to: score }
      notes:
        - { on: taints, text: Removes nodes with a taint the Pod does not tolerate. }
        - { on: affinity, text: Removes nodes whose labels the node selector or node affinity does not match. }
        - { on: fit, text: Removes nodes without room for the Pod's requests. }
        - { on: score, text: "Ranks the rest. When no node is left, the Pod stays Pending." }
  - figure:
      kind: scene
      world:
        setup:
          - run: kubectl label node {{ssdNode}} disktype=ssd
      focus: { scope: default, kinds: [Pod, Node] }
      show: [{ fact: Labels, keys: [disktype] }, Node-Selectors, Taints]
      frames:
        - caption: "A cluster with one labelled node: `{{ssdNode}}` carries `disktype=ssd`."
        - steps:
            - apply: |
                apiVersion: v1
                kind: Pod
                metadata:
                  name: probe
                spec:
                  nodeSelector:
                    disktype: nvme
                  containers:
                    - name: probe
                      image: nginx:1.31.8
          at: { actor: kube-scheduler, about: Pod/probe }
          caption: "A Pod that asks for `disktype=nvme` arrives. The scheduler filters every node: {{@cause}}"
        - steps:
            - run: kubectl label node {{ssdNode}} disktype=nvme --overwrite
          at: { actor: kube-scheduler, about: Pod/probe }
          caption: "The label changes, the scheduler tries the Pod again: {{@cause}}"
      caption: >-
        One scheduling decision, node by node: each node is kept or removed by a filter, and a
        change to a node makes the scheduler try a waiting Pod again.
      alt: >-
        Three frames. First, three nodes, one labelled disktype=ssd. Second, a Pod named probe
        with the node selector disktype=nvme is Pending, and the scheduler's verdict lists a
        reason for each of the three nodes. Third, after the node is relabelled disktype=nvme,
        the scheduler binds probe to it.
  - text: |
      **Read the scheduler's reason first.** For a Pod it cannot place, the scheduler records a
      `FailedScheduling` event that counts the rejected nodes per reason
      (`0/3 nodes are available: …`): `kubectl -n {{ns}} describe pod <pod>`, or
      `kubectl -n {{ns}} get events`.
  - when: { cause: taint }
    text: |
      A toleration permits, it never attracts: the node selector still keeps `{{app}}` on SSD
      nodes, which the grader checked by scaling to six replicas.
  - when: { cause: selector }
    text: |
      Labels are case-sensitive. Deleting the node selector would also have started the Pods, on
      any node; the grader scaled to six replicas to check. Node affinity with `operator: In`
      states the same requirement.
  - when: { cause: memory }
    text: |
      The scheduler adds up requests, not real usage. Deleting the request would also have started
      the Pods, and taken away the number capacity planning relies on.
  - text: |
      **The fix belongs in the Pod template**, by `kubectl edit` or a corrected manifest: a Pending
      Pod's spec is almost all immutable, and its ReplicaSet would recreate it from the old
      template. A changed template rolls out a new ReplicaSet, as the comparison shows.

      **In reality** the scheduler retries Pending Pods when something relevant changes (a node, a
      taint, a deleted Pod), not on a timer.
