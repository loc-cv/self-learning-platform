case: apply/overwrite
description: kubectl apply --overwrite=false when another client changed a field the manifest also changes (a three-way merge conflict), with and without --openapi-patch; apply to an object kubectl edit or create made, and to an object in a namespace that does not exist.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
