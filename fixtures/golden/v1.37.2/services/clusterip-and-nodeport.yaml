            ipFamilies:
              - IPv4
            ipFamilyPolicy: SingleStack
            ports:
              - nodePort: 30080
                port: 80
                protocol: TCP
                targetPort: 80
            selector:
              app: web
            sessionAffinity: None
            type: NodePort
