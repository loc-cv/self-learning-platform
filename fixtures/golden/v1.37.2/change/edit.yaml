# Format and normalization tokens: docs/FIDELITY.md §6.
case: change/edit
description: "kubectl edit with KUBE_EDITOR set to scripts from the case (the real binary then runs without a terminal) - the file kubectl writes (cat as the editor: the header, YAML or JSON, a List for several objects, CRLF line endings), a change sent as a patch (--output-patch), --save-config (the annotation it writes holds managedFields, DIV-015: not compared), an edit that only removes what kubectl fills back in (skipped), a file that fails validation and is fixed on the second open (the error and the reasons in the reopened file), an object the server refuses and an editor that then quits unchanged (the copy kept), a changed name, an empty file (TMPDIR=$HOME where kubectl prints the kept file's path: os.TempDir reads it, and the path stays inside the case's directory); and the errors - an editor that is not there or fails, no object, no argument, a bad -o, a bad --validate."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
steps:
