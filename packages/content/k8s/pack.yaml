# The Kubernetes pack (docs/LEARNING_MODEL.md §3): the skills items may name, with their
# prerequisites, and the tracks. R1 runs grow both with the content of each area.
id: k8s
title: Kubernetes (CKA and CKAD, v1.37)
description: Practice for the CKA and CKAD exams on a simulated kubeadm cluster.
skills:
  - id: k8s.workloads.deployments
    title: Create and configure Deployments
  - id: k8s.networking.services
    title: Expose Pods through a Service
  - id: k8s.workloads.declarative-manifests
    title: Keep an application in manifests that recreate it
  - id: k8s.troubleshooting.pending-pods
    title: Find out why Pods stay Pending
  - id: k8s.scheduling.taints
    title: Taints and tolerations
  - id: k8s.scheduling.node-selection
    title: Node selectors and node affinity
  - id: k8s.scheduling.resource-requests
    title: Resource requests and node capacity
  - id: k8s.troubleshooting.stuck-rollout
    title: Find and fix a rollout that does not finish
  - id: k8s.troubleshooting.service-endpoints
    title: Find out why a Service has no endpoints
tracks:
  - id: k8s.track.first-labs
    title: First labs
    description: The three labs of the first slice, from building an application to repairing one.
    items:
      - k8s.workloads.deployment-service-01
      - k8s.scheduling.pending-pods-01
      - k8s.troubleshooting.broken-rollout-01
