description: >-
  Kubeconfig files the client cannot load, as every verb reports them (kubectl get, kubectl
  config): a name repeated in a list (the conversion error with Go's %v of the list), a null list
  element, a number where a list belongs, a document that is not a mapping, an apiVersion that is
  not a string, and a KUBECONFIG entry under a regular file (ENOTDIR).
server: false
files:
  dup.yaml: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: c
      cluster:
        server: https://a.example:6443
        certificate-authority-data: aGk=
    - name: d
      cluster:
        server: https://b.example:6443
        insecure-skip-tls-verify: true
        tls-server-name: api.b
    - name: c
      cluster:
        server: https://c.example:6443
        proxy-url: http://proxy:3128
        disable-compression: true
    contexts:
    - name: x
      context:
        cluster: c
        user: u
    current-context: x
    users:
    - name: u
      user:
        token: abc
  users.yaml: |
    apiVersion: v1
    kind: Config
    contexts:
    - name: a
      context:
        cluster: k
        namespace: team-a
    - name: a
    users:
    - name: u
      user:
        token: t
        client-key-data: aGk=
        as: jane
        as-groups: [g1, g2]
        as-user-extra:
          b: [yy]
          a: [x, z]
    - name: v
      user:
        username: admin
        password: s3cret
    - name: u
      user: {}
  contexts.yaml: |
    contexts:
    - name: a
      context:
        cluster: k
        user: u
        namespace: team-a
    - name: b
    - name: a
  nullitem.yaml: |
    clusters:
    - null
    - name: ""
      cluster:
        server: https://z.example:6443
  number.yaml: |
    apiVersion: v1
    kind: Config
    clusters: 3
  scalar.yaml: |
    hello
  version.yaml: |
    kind: [Config]
    apiVersion: 1
  comment.yaml: |
    # only a comment
  good.yaml: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: g
      cluster:
        server: https://g.example:6443
    contexts:
    - name: g
      context:
        cluster: g
    current-context: g
  regular: |
    not a directory
steps:
  - run: kubectl get pods --kubeconfig dup.yaml
  - run: kubectl config view --kubeconfig dup.yaml
  - run: KUBECONFIG=dup.yaml kubectl config get-contexts
  - run: KUBECONFIG=users.yaml kubectl get pods
  - run: KUBECONFIG=users.yaml kubectl config view
  - run: kubectl get pods --kubeconfig contexts.yaml -n default
  - run: kubectl config view --kubeconfig contexts.yaml
  - run: KUBECONFIG=nullitem.yaml kubectl get pods
  - run: kubectl get pods --kubeconfig number.yaml
  - run: KUBECONFIG=good.yaml:number.yaml kubectl config view
  - run: KUBECONFIG=number.yaml:dup.yaml kubectl get pods
  - run: kubectl get pods --kubeconfig scalar.yaml
  - run: kubectl config view --kubeconfig version.yaml
  - run: kubectl config view --kubeconfig comment.yaml
  - run: KUBECONFIG=regular/config kubectl get pods
  - run: KUBECONFIG=regular/config kubectl config view
  - run: KUBECONFIG=missing.yaml:regular/config:good.yaml kubectl get pods
  - run: kubectl get pods --kubeconfig regular/config
  - run: kubectl config view --kubeconfig regular/config
  - run: KUBECONFIG=regular/config kubectl config current-context
