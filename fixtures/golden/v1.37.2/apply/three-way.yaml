case: apply/three-way
description: "kubectl apply's three-way merge: fields and list items removed from the manifest are removed from the object (an env var and a container port by their merge keys, a label, an annotation), changes made by other clients survive unless the manifest owns the field, output formats, dry runs, and apply's own errors."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
steps:
