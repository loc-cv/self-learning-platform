description: >-
  kubectl __complete for the value of every flag of every command that takes one, with no
  server: the flags with a completion function (output formats, subresources, containers,
  contexts), the -f file filter (FilterFileExt with json, yaml, yml), the flags whose NoOptDefVal
  makes the next word an argument (dry-run, validate, cascade), and the default directive.
server: false
