apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: <<cert:ca>>
    server: https://172.16.0.10:6443
  name: kubernetes
contexts:
- context:
    cluster: kubernetes
    user: kubernetes-admin
  name: kubernetes-admin@kubernetes
current-context: kubernetes-admin@kubernetes
kind: Config
users:
- name: kubernetes-admin
  user:
    client-certificate-data: <<cert:admin>>
    client-key-data: <<key:admin>>
