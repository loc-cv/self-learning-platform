case: controllers/gc-orphan-foreground
description: "The garbage collector: after an orphaning delete of a Deployment it removes the ReplicaSet's ownerReference (the Pods keep theirs); a foreground delete, held by a finalizer on the only Pod, leaves the Deployment and its ReplicaSet with deletionTimestamp and the foregroundDeletion finalizer until the Pod goes. Each Deployment has one Pod; its placement is a scheduling tie (anyWorker)."
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
