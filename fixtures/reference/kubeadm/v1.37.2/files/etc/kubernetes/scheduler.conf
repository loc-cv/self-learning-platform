apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: <<cert:ca>>
    server: https://172.16.0.10:6443
  name: kubernetes
contexts:
- context:
    cluster: kubernetes
    user: system:kube-scheduler
  name: system:kube-scheduler@kubernetes
current-context: system:kube-scheduler@kubernetes
kind: Config
users:
- name: system:kube-scheduler
  user:
    client-certificate-data: <<cert:scheduler>>
    client-key-data: <<key:scheduler>>
