description: >-
  kubectl apply's three-way merge: fields and list items removed from the manifest are removed from
  the object (an env var and a container port by their merge keys, a label, an annotation), changes
  made by other clients survive unless the manifest owns the field, output formats, dry runs, and
  apply's own errors.
files:
  app-v1.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: app
      labels:
        app: app
        owner: team-a
      annotations:
        note: first
    spec:
      replicas: 0
      selector:
        matchLabels:
          app: app
      template:
        metadata:
          labels:
            app: app
        spec:
          containers:
          - name: web
            image: nginx:1.27
            env:
            - name: MODE
              value: production
            - name: DEBUG
              value: "false"
            ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          - name: sidecar
            image: busybox:1.36
            command: ["sleep", "3600"]
  app-v2.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: app
      labels:
        app: app
    spec:
      replicas: 0
      selector:
        matchLabels:
          app: app
      template:
        metadata:
          labels:
            app: app
        spec:
          containers:
          - name: web
            image: nginx:1.27
            env:
            - name: MODE
              value: staging
            ports:
            - containerPort: 80
              name: http
  cm.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: settings
    data:
      a: "1"
      b: "2"
  cm-v2.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: settings
    data:
      a: "10"
  two.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: two-a
    data:
      k: v
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: two-b
  noname.yaml: |
    apiVersion: v1
    kind: ConfigMap
    data:
      a: b
  generated.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      generateName: gen-
  other-ns.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: other
      namespace: kube-public
  nulls.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nulls
      labels:
        a: null
    data:
      x: "1"
      y: null
steps:
  - run: kubectl apply -f app-v1.yaml
  - run: kubectl apply -f app-v2.yaml
  - objects: [deployment/app]
  - run: kubectl apply -f cm.yaml
  - run: kubectl label configmap settings extra=yes
  - run: kubectl patch configmap settings -p '{"metadata":{"annotations":{"touched":"yes"}}}'
  - run: kubectl apply -f cm-v2.yaml
  - run: kubectl get configmap settings -o yaml
  - run: kubectl patch configmap settings -p '{"data":{"a":"99"}}'
  - run: kubectl apply -f cm-v2.yaml
  - run: kubectl apply -f cm-v2.yaml
  - run: kubectl apply -f two.yaml -o yaml
  - run: kubectl apply -f two.yaml -o json
  - run: kubectl apply -f two.yaml -o name
  - run: kubectl apply -f cm.yaml --dry-run=client -o yaml
  - run: kubectl apply -f cm.yaml --dry-run=server -o name
  - run: kubectl apply -f cm.yaml --dry-run
  - run: kubectl get configmap settings -o yaml
  - run: kubectl apply -f nulls.yaml
  - run: kubectl get configmap nulls -o yaml
  - run: kubectl apply -f noname.yaml
  - run: kubectl apply -f generated.yaml
  - run: kubectl apply -f other-ns.yaml -n default
  - run: kubectl apply -f two.yaml -o wide
  - run: kubectl apply -f two.yaml --prune
  - run: kubectl apply -f two.yaml --force-conflicts
  - run: kubectl apply -f two.yaml --subresource=status
  - run: kubectl apply -f two.yaml --dry-run=server --force
  - run: kubectl apply -f two.yaml --cascade=sideways
  - run: kubectl apply
  - run: kubectl apply x -f two.yaml
  - run: kubectl apply -f missing.yaml
  - objects: [configmap/settings, configmap/two-a]
