case: describe/deployment
description: describe deployment after scaling up and down (the ScalingReplicaSet events), after a rollout (old and new ReplicaSets), with the Recreate strategy, and with a Pod template that has annotations, a service account, command, environment, resources and volumes.
kubernetes: v1.37.2
oracle:
  mode: server
  etcd: v3.7.0
  kwok: v0.8.0
kwokAuthored:
  - Node .status.conditions (types, reasons, messages, times)
  - Lease kube-node-lease/<node> .spec (holderIdentity is KWOK's, a real kubelet writes the node name)
  - Pod .status, except .status.qosClass (API server) and the PodScheduled condition (scheduler)
