description: >-
  What `kubectl __complete` (cobra's hidden completion command, which the bash completion script
  calls on every Tab) answers - commands, resource types, names in the right namespace, flags,
  flag values, file filters, required flags, container names - and its directive.
files:
  pod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: multi
    spec:
      initContainers:
      - name: setup
        image: busybox:1.36
        command: ["true"]
      containers:
      - name: app
        image: nginx:1.27
        ports:
        - containerPort: 8080
      - name: sidecar
        image: nginx:1.27
  other-config: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        server: https://localhost:1
      name: far
    - cluster:
        server: https://localhost:2
      name: near
    contexts:
    - context:
        cluster: far
        user: alice
        namespace: team-a
      name: alice@far
    - context:
        cluster: near
        user: bob
      name: bob@near
    - context:
        cluster: near
        user: carol
      name: carol@near
    current-context: alice@far
    users:
    - name: alice
      user:
        token: a
    - name: bob
      user:
        token: b
    - name: carol
      user:
        token: c
setup:
  - do: kubectl create namespace team-a
  - do: kubectl create namespace team-b
  - do: kubectl run web-1 --image=nginx:1.27
  - do: kubectl run web-2 --image=nginx:1.27
  - do: kubectl run api --image=nginx:1.27
  - do: kubectl create -f pod.yaml
  - do: kubectl run db --image=nginx:1.27 -n team-a
  - do: kubectl run cache --image=nginx:1.27 -n team-a
  - do: kubectl create deployment frontend --image=nginx:1.27 --replicas=0
  - do: kubectl create deployment backend --image=nginx:1.27 --replicas=0 -n team-a
  - do: kubectl create configmap settings --from-literal=k=v
  - do: kubectl create service clusterip web --tcp=80:8080
steps:
  - run: kubectl __complete ''
  - run: kubectl __complete ge
  - run: kubectl __complete r
  - run: kubectl __completeNoDesc r
  - run: kubectl __complete get ''
  - run: kubectl __complete get po
  - run: kubectl __complete get pods ''
  - run: kubectl __complete get pods web
  - run: kubectl __complete get pods web-1 ''
  - run: kubectl __complete get pod/web-1 ''
  - run: kubectl __complete get pod/
  - run: kubectl __complete get pods,se
  - run: kubectl __complete get deploy ''
  - run: kubectl __complete -n team-a get pods ''
  - run: kubectl __complete get pods -n team-a ''
  - run: kubectl __complete get pods --namespace=team-a ''
  - run: kubectl __complete get pods -A ''
  - run: kubectl __complete get pods -n ''
  - run: kubectl __complete get pods -n te
  - run: kubectl __complete get pods --namespace=
  - run: kubectl __complete get pods --namespace=team-
  - run: kubectl __complete get pods -n=te
  - run: kubectl __complete get --
  - run: kubectl __complete get --a
  - run: kubectl __complete get -
  - run: kubectl __complete get --show-labels --sh
  - run: kubectl __complete get -o ''
  - run: kubectl __complete get -o j
  - run: kubectl __complete get pods --selector ''
  - run: kubectl __complete get pods -h ''
  - run: kubectl __complete get --bogus ''
