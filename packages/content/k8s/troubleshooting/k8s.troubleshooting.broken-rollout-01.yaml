id: k8s.troubleshooting.broken-rollout-01
kind: lab
title: Last night's release broke the site
skills:
  - k8s.troubleshooting.stuck-rollout
  - k8s.troubleshooting.service-endpoints
  - k8s.networking.services
  - k8s.workloads.deployments
curriculum:
  - cka.workloads.deployments-rollouts
  - cka.troubleshooting.services-networking
  - ckad.deployment.rolling-updates
  - ckad.networking.services
  - ckad.observability.debugging
difficulty: 3
targetMinutes: 10
world:
  topology: kubeadm-1cp-2w
  params:
    ns: { pick: [shop, billing, media] }
    app: { pick: [storefront, checkout, catalog] }
    replicas: { int: { min: 3, max: 4 } }
    badImage: { pick: [tag, name, registry] }
  setup:
    - apply: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: {{ns}}
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: {{app}}
          namespace: {{ns}}
        spec:
          replicas: {{replicas}}
          selector:
            matchLabels:
              app: {{app}}
          template:
            metadata:
              labels:
                app: {{app}}
            spec:
              containers:
                - name: {{app}}
                  image: nginx:1.14.2
                  ports:
                    - containerPort: 80
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: {{app}}
          namespace: {{ns}}
        spec:
          selector:
            app: {{app}}
          ports:
            - port: 80
              targetPort: 80
    - until:
        assert: k8s.rollout
        with: { namespace: "{{ns}}", name: "{{app}}" }
      timeout: 3m
    - advance: 10m
    # The release: a new image, with a typo of one of three kinds.
    - run: kubectl -n {{ns}} set image deployment/{{app}} {{app}}=nginx:1.31.80
      when: { badImage: tag }
    - run: kubectl -n {{ns}} set image deployment/{{app}} {{app}}=ngnix:1.31.8
      when: { badImage: name }
    - run: kubectl -n {{ns}} set image deployment/{{app}} {{app}}=mirror.corp.example/library/nginx:1.31.8
      when: { badImage: registry }
    - run: kubectl -n {{ns}} annotate deployment/{{app}} kubernetes.io/change-cause="upgrade nginx to 1.31.8"
    # The same evening, someone moved the Service to the recommended labels.
    - apply: |
        apiVersion: v1
        kind: Service
        metadata:
          name: {{app}}
          namespace: {{ns}}
        spec:
          selector:
            app.kubernetes.io/name: {{app}}
          ports:
            - port: 80
              targetPort: 80
    # Last night: long enough for the rollout to pass its progress deadline.
    - advance: 20m
ticket: |
  **`{{app}}` is down** (namespace `{{ns}}`)

  Since last night's release, every request to the `{{app}}` Service fails, and the release
  pipeline reports that the rollout of the `{{app}}` Deployment never finished.

  The release upgrades the site to `nginx:1.31.8`. It has to go out: rolling back to the old
  version is not an option.

  Get the `{{app}}` Service sending traffic to all {{replicas}} replicas, every one of them
  running `nginx:1.31.8`. A partner's firewall allows the Service by its cluster IP, so neither the
  Service nor the Deployment may be deleted and recreated.
hints:
  - >-
    Two symptoms, and they may not have the same cause. For the rollout, look at the newest Pods
    of `{{app}}`; for the Service, look at what it is connected to (`kubectl -n {{ns}} get
    endpointslices`).
  - text: >-
      The new Pods cannot pull their image: read the event or the container's waiting message, and
      compare the image name with the one the release meant. For the Service, compare its selector
      with the labels the Pods carry (`kubectl -n {{ns}} get pods --show-labels`).
    when: { badImage: [tag, name] }
  - text: >-
      The new Pods cannot pull their image: read the event or the container's waiting message.
      Where does the image come from, and does that host exist? For the Service, compare its
      selector with the labels the Pods carry (`kubectl -n {{ns}} get pods --show-labels`).
    when: { badImage: registry }
  - >-
    `kubectl -n {{ns}} set image deployment/{{app}} {{app}}=nginx:1.31.8` fixes the release. The
    Service selects `app.kubernetes.io/name={{app}}` but the Pods are labelled `app={{app}}`:
    either set the Service's selector back to `app: {{app}}` (`kubectl -n {{ns}} edit service
    {{app}}`), or add the label `app.kubernetes.io/name: {{app}}` to the Deployment's Pod
    template.
checks:
  - id: rollout-complete
    title: "The rollout of `{{app}}` has finished"
    assert: k8s.rollout
    with: { namespace: "{{ns}}", name: "{{app}}" }
    within: 3m
    weight: 2
  - id: runs-release
    title: "Every Pod of `{{app}}` runs `nginx:1.31.8`"
    assert: k8s.object
    with:
      kind: Pod
      namespace: "{{ns}}"
      selector: "app={{app}}"
      count: "{{replicas}}"
      where:
        - { path: "{.status.containerStatuses[*].image}", equals: docker.io/library/nginx:1.31.8 }
    within: 3m
  - id: service-endpoints
    title: "Service `{{app}}` sends traffic to all {{replicas}} replicas"
    assert: k8s.endpoints
    with: { namespace: "{{ns}}", service: "{{app}}", count: "{{replicas}}" }
    within: 3m
    weight: 2
  - id: service-kept
    title: "Service `{{app}}` was not deleted and recreated"
    assert: k8s.notRecreated
    with: { kind: Service, namespace: "{{ns}}", name: "{{app}}" }
  - id: deployment-kept
    title: "Deployment `{{app}}` was not deleted and recreated"
    assert: k8s.notRecreated
    with: { kind: Deployment, namespace: "{{ns}}", name: "{{app}}" }
solutions:
  - name: Fix the image, point the Service back at the Pods
    steps:
      - run: kubectl -n {{ns}} set image deployment/{{app}} {{app}}=nginx:1.31.8
      - run: kubectl -n {{ns}} edit service {{app}}
        editor:
          - replace: { from: "app.kubernetes.io/name: {{app}}", to: "app: {{app}}" }
      - until:
          assert: k8s.rollout
          with: { namespace: "{{ns}}", name: "{{app}}" }
        timeout: 3m
  - name: Give the Pods the label the Service now expects, in one manifest
    steps:
      - write:
          path: /root/{{app}}.yaml
          content: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{app}}
              namespace: {{ns}}
            spec:
              replicas: {{replicas}}
              selector:
                matchLabels:
                  app: {{app}}
              template:
                metadata:
                  labels:
                    app: {{app}}
                    app.kubernetes.io/name: {{app}}
                spec:
                  containers:
                    - name: {{app}}
                      image: nginx:1.31.8
                      ports:
                        - containerPort: 80
      - run: kubectl apply -f /root/{{app}}.yaml
      - until:
          assert: k8s.rollout
          with: { namespace: "{{ns}}", name: "{{app}}" }
        timeout: 3m
debrief:
  - figure:
      kind: compare
      left: { of: start }
      right: { of: solved }
      focus: { scope: "{{ns}}", kinds: [Deployment, ReplicaSet, Pod, Service] }
      show: [{ fact: Selector, keys: [app, app.kubernetes.io/name] }, { fact: Labels, keys: [app, app.kubernetes.io/name] }, Images]
      notes:
        - on: "Service/{{app}}"
          text: "Selects `app.kubernetes.io/name={{app}}`, a label no Pod carried: no endpoints, so every request failed."
        - on: "Deployment/{{app}}"
          text: >-
            Past its progress deadline (`progressDeadlineSeconds`, 600 s by default): its
            `Progressing` condition is `False` with reason `ProgressDeadlineExceeded`, which is what
            release pipelines watch.
      caption: >-
        Two faults, one release: the Service selected no Pod, and the new ReplicaSet's image could
        not be pulled.
      alt: >-
        Left, at the start: the Service selects app.kubernetes.io/name={{app}} and reaches no Pod;
        the old ReplicaSet's Pods, labelled app={{app}}, run nginx:1.14.2, and the new
        ReplicaSet's Pods fail to pull their image. Right, solved: one ReplicaSet runs
        nginx:1.31.8 and the Service sends traffic to all {{replicas}} of its Pods.
  - figure:
      kind: scene
      world:
        setup:
          - apply: |
              apiVersion: v1
              kind: Namespace
              metadata:
                name: {{ns}}
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: {{app}}
                namespace: {{ns}}
              spec:
                replicas: 4
                selector:
                  matchLabels:
                    app: {{app}}
                template:
                  metadata:
                    labels:
                      app: {{app}}
                  spec:
                    containers:
                      - name: {{app}}
                        image: nginx:1.14.2
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: {{app}}
                namespace: {{ns}}
              spec:
                selector:
                  app: {{app}}
                ports:
                  - port: 80
                    targetPort: 80
          - until:
              assert: k8s.rollout
              with: { namespace: "{{ns}}", name: "{{app}}" }
            timeout: 3m
      focus: { scope: "{{ns}}", kinds: [Deployment, ReplicaSet, Pod, Service] }
      show: [Images]
      frames:
        - caption: "Before the release: four Pods of `nginx:1.14.2`, all behind the Service."
        - caption: >-
            The release changes the image. The Deployment creates a new ReplicaSet with two Pods
            and lets one old Pod go: of four replicas, 25% may be extra (`maxSurge`, rounded up)
            and 25% missing (`maxUnavailable`, rounded down).
          steps:
            - { run: "kubectl -n {{ns}} set image deployment/{{app}} {{app}}=nginx:1.31.80", when: { badImage: tag } }
            - { run: "kubectl -n {{ns}} set image deployment/{{app}} {{app}}=ngnix:1.31.8", when: { badImage: name } }
            - { run: "kubectl -n {{ns}} set image deployment/{{app}} {{app}}=mirror.corp.example/library/nginx:1.31.8", when: { badImage: registry } }
            - advance: 1s
        - caption: >-
            The image cannot be pulled, so the new Pods never become ready and the rollout waits.
            The Service selects them but sends them nothing; the old Pods keep serving. A bad
            image alone is a stuck rollout, not an outage.
          steps:
            - advance: 1m
        - caption: >-
            The image is fixed. The broken ReplicaSet's Pods go at once, a third ReplicaSet starts
            Pods, and each one that becomes ready lets an old one go.
          steps:
            - run: kubectl -n {{ns}} set image deployment/{{app}} {{app}}=nginx:1.31.8
            - advance: 3s
        - caption: >-
            Done: every Pod runs `nginx:1.31.8`. The two older ReplicaSets stay, scaled to zero,
            so the Deployment can roll back to them.
          steps:
            - until:
                assert: k8s.rollout
                with: { namespace: "{{ns}}", name: "{{app}}" }
              timeout: 3m
      caption: A rolling update stalls on an image that cannot be pulled, while the old ReplicaSet keeps serving.
      alt: >-
        Five frames of a rollout of four replicas in a small world of its own, with a Service that
        selects the Pods. The new ReplicaSet gets two Pods whose image pull fails and the old one
        keeps three ready Pods, which the Service keeps routing to. After the image is fixed, a
        third ReplicaSet's Pods replace the old ones until only it has Pods.
  - when: { badImage: tag }
    text: |
      **The image.** `nginx:1.31.80`: the repository exists, the tag does not, so the registry
      answered "not found". The kubelet reported `ErrImagePull`, then `ImagePullBackOff` while it
      waited to try again.
  - when: { badImage: name }
    text: |
      **The image.** `ngnix:1.31.8`: Docker Hub answers a missing repository the way it answers a
      private one, "pull access denied, repository does not exist or may require authorization".
      The kubelet reported `ErrImagePull`, then `ImagePullBackOff` while it waited to try again.
  - when: { badImage: registry }
    text: |
      **The image.** `mirror.corp.example` does not resolve, so the pull failed before any registry
      was asked ("no such host"). The kubelet reported `ErrImagePull`, then `ImagePullBackOff`
      while it waited to try again.
  - text: |
      **Mental model.** A Service that does not answer: what does it select, and does anything
      ready carry that label now (`kubectl -n {{ns}} get endpointslices`, then
      `get pods --show-labels`)? A rollout that does not finish: look at its newest Pods. A
      selector that matches nothing is valid, so nothing complained.

      **Either selector fix is valid**: point the Service back at `app={{app}}`, or add
      `app.kubernetes.io/name` to the Pod template (the Deployment's own selector is immutable, its
      template's labels are not). Recreating the Service would have given it a new cluster IP.

      **In reality** `kubectl rollout undo`, which restores the previous template, is often the
      right first move; here the outage was in the Service, and the ticket required the release.
